<div class="dg-body"><article class="container__body">
					<div class="body__content">
						<div class="flex-column">
							<!-- ★ 통신사 약관(본인인증 필수 동의)은 여기에 없다 — 과업 zeroWebviewJoin002.
							     퍼블리싱 v1.3 이 순서를 「본인정보 → 약관 → 인증번호」로 바꿔
							     #step_clause 로 옮겼다. 동의 시점이 발송 직전으로 붙는다. -->

							<!-- 정보입력
							     ★ 필드 순서는 퍼블리싱 v1.3 BM100 을 따른다
							        (이메일 → 휴대폰번호 → 통신사 → 주민등록번호 → 이름).
							        입력 id 는 v1 것을 그대로 계승한다 — JS 전반이 id 로 읽는다. -->
							<!-- 정보입력 — 퍼블리싱 v1.3 BM100 (과업 zeroWebviewJoin002)

							     ★ 한 번에 한 칸씩 물어본다. 공통 스크립트(common-ui.js stepFormHandler)가
							       js-step-N 오름차순으로 노출하고, js-require 가 전부 채워져야
							       js-step-submit(「인증하기」)의 dis 를 푼다.
							       화면 JS 는 이 판정에 관여하지 않는다 — 두 벌이 dis 를 다투면 안 된다.

							     ★ 노출 순서와 DOM 순서가 다르다. DOM 은 이메일→휴대폰→통신사→주민번호→이름,
							       노출은 이름(1)→주민번호(2)→통신사(3)→휴대폰(4)→이메일(5)이다.
							       퍼블리싱 그대로이며 임의로 맞추지 않는다.

							     ★ maxlength — 공통의 완료 판정이 "maxlength 가 있으면 그 자릿수를
							       **정확히** 채워야 완료"다(common-ui.js isFilled). 그래서 자유입력 칸에
							       길이를 걸면 그 단계에서 못 넘어간다.
							       · 이름   : 뺀다. 첫 단계(js-step-1)라 막히면 가입 자체가 안 된다
							       · 이메일 : 150 을 둔다. js-require 가 없어 활성 판정 밖이고,
							                 마지막 단계라 advance 의 while 조건에 안 걸린다.
							                 DB 컬럼이 150 이라 길이를 열어두면 잘리거나 E002 가 난다
							       · 휴대폰 13(하이픈 2개 포함) · 생년월일 6 · 뒷자리 1 — 자릿수형 그대로

							     ★ 입력 id 는 v1 것을 계승한다 — JS 전반이 id 로 읽는다. -->
							<div id="info_div" class="form-box js-form-box gap-32">
								<!-- 이메일 (선택) — TB_MEMBER.EMAIL 에 저장한다 (과업 zeroWebviewJoin001)

								     저장 경로
								       화면 → zero_webview_lgn_000004_v1(EMAIL) → TB_MEMBER_U030

								     ★ 새로 들어왔거나 기존 값과 달라졌을 때만 UPDATE 한다. 액션 6-4 참조.
								       빈 값은 "지워달라"가 아니라 "건드리지 말라"다.

								     ★ TB_MEMBER.EMAIL 은 D'Guard 암호화 컬럼이다 — TB_MEMBER_U030 의 SQL 이
								       ENCRYPT 를 건다. 조회 IDO 11개가 전부 DECRYPT(EMAIL) 로 읽는다.

								     ★ TB_MEMBER_C001(신규 회원 등록)은 고치지 않았다. 비플페이 전 가입 경로가
								       공유하는 등록물이라, 신규가입도 C001 직후 U030 으로 채운다.

								     선택 입력이라 js-require 를 붙이지 않는다. -->
								<div class="form__item js-form-item js-step-5">
									<div class="form__item-header input-line--header">
										<h3 class="form__label container__headline container__headline--lv1">
											<label>이메일(선택)</label>
										</h3>
									</div>

									<div class="form__item-wrap">
										<div class="input-type--line">
											<input id="email" type="email" value="" placeholder="이메일 주소" maxlength="150" inputmode="email" autocomplete="off">
										</div>
									</div>
								</div>

								<!-- 휴대폰번호

								     ★ js-phone-number — 공통 스크립트가 이 래퍼 안의 input 에 타이핑 즉시
								       숫자만 남기고 하이픈을 다시 꽂는다. 사용자는 숫자만 넣는다.
								     ★ maxlength 13 은 하이픈 2개가 값에 포함되기 때문이다. -->
								<div class="form__item js-form-item js-step-4 js-require">
									<div class="form__item-header input-line--header">
										<h3 class="form__label container__headline container__headline--lv1">
											<label>휴대폰번호</label>
										</h3>
									</div>

									<div class="form__item-wrap">
										<div class="input-type--line js-phone-number">
											<input id="mob_no" type="tel" value="" placeholder="휴대폰번호" maxlength="13" inputmode="numeric">
										</div>
									</div>
								</div>

								<!-- 통신사 — v1.3 에서 휴대폰번호와 분리된 독립 칸이 됐다.
								     공통 스크립트가 이 칸을 열면서 선택 팝업까지 자동으로 띄운다. -->
								<div class="form__item js-form-item js-step-3 js-require">
									<div class="form__item-header input-line--header">
										<h3 class="form__label container__headline container__headline--lv1">
											<label>통신사</label>
										</h3>
									</div>

									<div class="form__item-wrap">
										<div class="input-type--line">
											<button type="button" class="input-unit fc-placeholder js-select--result js-popup-open" data-modal="popup-select--telecom">
												<span id="tel_corp" class="target">통신사 선택</span><i class="icon icon--arrow-24 pointer-bottom"></i>
											</button>
										</div>
									</div>
								</div>

								<!-- 주민등록번호 -->
								<div class="form__item regist-code js-form-item js-step-2 js-require">
									<div class="form__item-header input-line--header">
										<h3 class="form__label container__headline container__headline--lv1">
											<label>주민등록번호</label>
										</h3>
									</div>

									<div class="form__item-wrap">
										<div class="input-type--line">
											<input id="birth" type="text" value="" placeholder="생년월일 6자리" maxlength="6" inputmode="numeric">
											<span class="between-bar">-</span>
											<input id="gender" type="text" value="" placeholder="0" maxlength="1" inputmode="numeric">
											<div class="currency-box">
												<p class="currency-bullet"></p>
												<p class="currency-bullet"></p>
												<p class="currency-bullet"></p>
												<p class="currency-bullet"></p>
												<p class="currency-bullet"></p>
												<p class="currency-bullet"></p>
											</div>
										</div>
									</div>
								</div>

								<!-- 이름 -->
								<div class="form__item js-form-item js-step-1 js-require">
									<div class="form__item-header input-line--header">
										<h3 class="form__label container__headline container__headline--lv1">
											<label>이름</label>
										</h3>
									</div>

									<div class="form__item-wrap">
										<div class="input-type--line">
											<!-- enterkeyhint — 이 칸은 자유입력이라 공통이 Enter 로만 다음 단계를 연다
											     (자릿수형·셀렉트형은 자동). 키패드 액션키의 뜻을 분명히 해 둔다. -->
											<input id="name" type="text" value="" placeholder="이름" enterkeyhint="next">
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</article></div>
