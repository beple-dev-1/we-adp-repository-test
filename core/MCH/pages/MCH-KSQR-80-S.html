                                            </div>

                                            <!-- 신청서 정보 ->
                                            <div class="list_content">
                                                <p class="label">작성 중</p>
                                                <p class="date regist">신청서 접수 2022.09.01</p>
                                                <!-- 심사 진행 상태 ->
                                                <div class="state_wrap">
                                                    <p class="state_item">비즈플레이 가맹점<span class="label">심사 중</span></p>
