<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>약관동의</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="MCH-AFLT-80-10-10-S">
<div com-step-id="step1" class="wrap">
<input data-element-id="MCH-AFLT-80-10-10-S-e15" id="biz_no" hidden="hidden" value="123-45-67890">
<input data-element-id="MCH-AFLT-80-10-10-S-e16" id="tax_type" hidden="hidden" value="표본">
<input data-element-id="MCH-AFLT-80-10-10-S-e17" id="sub_biz_cd" hidden="hidden" value="표본">
<input data-element-id="MCH-AFLT-80-10-10-S-e18" id="mate_pos_yn" hidden="hidden" value="표본">
<input data-element-id="MCH-AFLT-80-10-10-S-e19" id="seo_yn" hidden="hidden" value="표본">
<input data-element-id="MCH-AFLT-80-10-10-S-e20" id="mcp_yn" hidden="hidden" value="표본">

	<!-- header -->
	<div class="header floating-back-header floating-sticky">
		<h1>신규 가맹점 신청</h1>
		<p class="history_back">
			<a data-element-id="MCH-AFLT-80-10-10-S-e11" onClick="page_back();" class="btn-history-back">뒤로가기</a>
		</p>
	</div>
	<!-- // header -->

	<div class="container">
		<div class="content">
			<!-- 신규가맹점 신청 -->
			<div class="new_store">
				<!-- 약관동의 -->
				<div class="join addBtn-pb58">
					<h2 class="step_txt">
						아래 약관에 동의해 주세요.
					</h2>
					<!-- 약관 전체동의 -->
					<div class="all_agree">
						<a data-element-id="MCH-AFLT-80-10-10-S-e12" id="check_all" data-attr="N"><strong>전체 동의</strong></a><!-- 전체동의 시 "on"클래스 추가 -->
					</div>
					<!-- //약관 전체동의 -->
					<!-- 개별 약관 동의 -->
					<div class="agreeCon">
						<p><label for="agree-chk1"><input type="checkbox" class="checkSingle"><span>비즈플레이 가맹점 계약서 (필수)</span></label><a data-element-id="MCH-AFLT-80-10-10-S-e13" onclick="uf_showClauseDetail('065000', '');return false;">약관보기</a></p>
						<p><label for="agree-chk3"><input type="checkbox" class="checkSingle"><span>개인정보 수집 및 이용 동의 (필수)</span></label><a onclick="uf_showClauseDetail('060017', '');return false;">약관보기</a></p>
<!-- 						<p><label for="agree-chk2"><input type="checkbox" class="checkSingle"><span>고유식별정보 처리 동의 (필수)</span></label><a onclick="uf_showClauseDetail('060014');return false;">약관보기</a></p> -->
					</div>
					<!-- //개별 약관 동의 -->
				</div>
				<!-- //약관동의 -->
			</div>
			<!-- //신규가맹점 신청 -->
			<!-- 하단 고정버튼 -->
			<div class="btn_botFix_w">
				<div class="inner bg_white">
					<a data-element-id="MCH-AFLT-80-10-10-S-e14"  class="btn_default btn-style-h48 round_r6" id="btnAgree"><!-- 활성/비활성 시 on클래스 추가/삭제 -->
						<span>다음</span>
					</a>
				</div>
			</div>
			<!-- //하단 고정버튼 -->
		</div>
	</div><!-- // container -->
</div><!-- // wrap -->

<!-- step 2 -->
<div com-step-id="step2"   style="position: fixed; left: 0; background: white; display: none; overflow: auto;">
    <div class="header floating-back-header floating-sticky">
        <a role="button" onclick="uf_back();" class="btn-history-back">뒤로가기</a>
        <h1 id="clause_title" style="position: relative;"></h1>
    </div>

    <!-- // container -->
    <div class="container" style="height:100%;">
        <div class="content" style="height:100%;">
            <div class="body" id="clause_content" style="height:calc(100vh - 95px);"><!-- sample:begin --><p>제1조 (목적) 이 약관은 서비스 이용에 관한 기본 사항을 정합니다.</p><p>제2조 (정의) 이 약관에서 쓰는 용어의 뜻은 관련 법령과 서비스 안내에 따릅니다.</p><p>제3조 (약관의 효력) 이 약관은 서비스 화면에 게시하여 효력이 생깁니다.</p><!-- sample:end --></div>
			<div class="btn_botFix_w">
				<div class="inner bg_white">
					<a href="#" class="btn-style-h48 btn-skyBlue round_r8 on" onclick="uf_back();">
						<span>확인</span>
					</a><!-- 활성/비활성 시 on클래스 추가/삭제 -->
				</div>
			</div>
        </div>
    </div>
</div>
<!-- // step 2 --> 
<!-- //레이어 -->
</body>
</html>
