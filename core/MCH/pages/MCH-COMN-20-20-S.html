<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>업종검색</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
  <link rel="stylesheet" href="../assets/js/jexjs/jexmd.css">
  <link rel="stylesheet" href="../assets/js/jexjs/jex.css">
</head>
<body data-screen-id="MCH-COMN-20-20-S">
<!--<button id="pop_test">pop</button>    <!--TODO remove->-->
<div class="wrap" id="popup">
    <div class="header floating-back-header floating-sticky">
        <h1>업종코드 검색</h1>
        <a data-element-id="MCH-COMN-20-20-S-e05" class="btn-out-page" id="btn_popclose" onclick="popControll.closePop()">종료하기</a>
    </div>
    <!-- // header -->

    <div class="container">
        <div class="content">
            <!-- 컨텐츠 영역 -->
            <div class="new_store search">
                <!-- 검색영역 -->
                <div class="local_sch">
                    <div class="bg btn_right">
                        <input data-element-id="MCH-COMN-20-20-S-e08" type="text" placeholder="업종명 또는 업종코드 입력" value="" id="upjong" onkeyup="evt_upjong()">
                        <a data-element-id="MCH-COMN-20-20-S-e06" class="btn search_right" onclick="fnSearch()"><span class="blind">검색</span></a>
                        <!--<a class="btn del" onclick="del_kwd()" style="display: none"><span class="blind">검색어삭제</span></a>-->
                    </div>
                </div>
                <!-- 검색결과 -->
                <div class="search_result-container">
                    <!-- 결과없음 -->
                    <div class="result_empty" style="display: none;" id="no_data">
                        <p class="result_text">검색 결과가 없습니다.</p>
                    </div>
                    <!-- 검색결과 -->
                    <div class="result_content addBtn-pb58" id="data"><!-- sample:begin --><div class='result_item' name='upjong_nm' onclick='clk_upjong($(this))' data-uptae='음식점업' data-jongmok='카페' data-upjong-cd='561011' data-upjong-nm='커피 전문점'><button type='button' class='result_btn'><div class='detail_box'><p class='detail_text head'>업태</p><p class='detail_text'>음식점업</p></div><div class='detail_box'><p class='detail_text head'>종목</p><p class='detail_text'>카페</p></div><div class='detail_box'><p class='detail_text head'>(업종코드)<br>업종명</p><p class='detail_text'>(561011)<br>커피 전문점</p></div></button><p class='select_icon icon chk-18'><span class='blind-i'>선택됨</span></p></div><div class='result_item' name='upjong_nm' onclick='clk_upjong($(this))' data-uptae='음식점업' data-jongmok='카페' data-upjong-cd='561011' data-upjong-nm='커피 전문점'><button type='button' class='result_btn'><div class='detail_box'><p class='detail_text head'>업태</p><p class='detail_text'>음식점업</p></div><div class='detail_box'><p class='detail_text head'>종목</p><p class='detail_text'>카페</p></div><div class='detail_box'><p class='detail_text head'>(업종코드)<br>업종명</p><p class='detail_text'>(561011)<br>커피 전문점</p></div></button><p class='select_icon icon chk-18'><span class='blind-i'>선택됨</span></p></div><!-- sample:end --></div>

                    <!-- 맨처음 -->
                    <div class="result_intro addBtn-pb58" id="intro" style="display:none;">
                        <div class="content-header">
                            <h3 class="content_tit">이렇게 검색해 주세요!</h3>
                        </div>
                        <div class="intro">
                            <div class="intro_item">
                                <p class="intro_text">
                                    업종코드
                                </p>
                                <p class="intro_text description">
                                    예시) 5611,56111
                                </p>
                            </div>
                            <div class="intro_item">
                                <p class="intro_text">
                                    업종명
                                </p>
                                <p class="intro_text description">
                                    예시) 음식점, 한식
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 고정버튼 -->
            <div class="btn_botFix_w">
                <div class="inner bg_white pdt10">
                    <a data-element-id="MCH-COMN-20-20-S-e07" class="btn_default btn-style-h48 round_r6" id="upjong_sel" onclick="popControll.closePop()"><!-- 활성/비활성 시 on클래스 추가/삭제 -->
                        <span>확인</span>
                    </a>
                </div>
            </div>
            <!-- //하단 고정버튼 -->
        </div>
    </div><!-- // container -->
</div>
</body>
</html>
