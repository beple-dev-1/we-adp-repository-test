<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>비플오더 주문가능수량 설정 수정</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPG-OBO-10-30-30-S">
<input type="hidden" name="bpAfltSeq" id="bpAfltSeq" value=""/>
<input type="hidden" name="preUrl" id="preUrl" value=""/>

<div class="wrap bg_f7">
    <div class="header floating-back-header floating-sticky">
        <h1>주문 설정</h1>
        <a data-element-id="BPG-OBO-10-30-30-S-e06" class="btn-history-back" id="back">뒤로가기</a>
    </div>
    <!-- // header -->
    <div class="container">
        <div class="content">
            <!-- 영업시간 등록 -->
            <div class="bpleOder addBtn-pb58">
                <div class="tit_bx pdt38">
                    <h2>
                        <strong>주문 가능 수량</strong>
                    </h2>
                    <p>최소 및 최대 주문 가능 수량을 설정하세요.</p>
                </div>

                <div class="store_profile complete_time">
                    <div class="iptbx dual">
                        <div class="time   disabled " id="minOdrQtyDiv"><!-- [D] 비활성화 시 'disabled'클래스 추가 -->
<!--                            <h3 class="tit"></h3>-->
                            <div class="inner  ipt " id="minOdrQtyInnerDiv"><!-- 입력 시 ipt 클래스 추가 -->
                                <input data-element-id="BPG-OBO-10-30-30-S-e08" type="tel"  value="1" placeholder="최소수량" id="minOdrQty" autofocus >
                                <span class="txt">&nbsp;잔</span>
                            </div>
                        </div>
                        <div class="time   disabled " id="maxOdrQtyDiv"><!-- [D] 비활성화 시 'disabled'클래스 추가 -->
<!--                            <h3 class="tit">최대수량</h3>-->
                            <div class="inner  ipt " id="maxOdrQtyInnerDiv"><!-- 입력 시 ipt 클래스 추가 -->
                                <input data-element-id="BPG-OBO-10-30-30-S-e09" type="tel" value="1"  placeholder="최대수량" id="maxOdrQty">
                                <span class="txt">&nbsp;잔</span>
                            </div>
                        </div>
                    </div>
                    <div class="chk_bx"><label><input data-element-id="BPG-OBO-10-30-30-S-e10" type="checkbox" id="noLimitQtyYn"  checked  >수량 제한 없음</label></div>
                </div>
            </div>
            <!--//영업시간 등록 -->

            <!-- 하단 고정버튼 -->
            <div class="btn_botFix_w">
                <div class="inner bg_grey">
                    <a data-element-id="BPG-OBO-10-30-30-S-e07" class="btn_default btn-style-h48 round_r8  on " id="save" ><span>저장</span></a><!-- 활성/비활성화 시 클래스 on 추가/제거 -->
                </div>
            </div>
            <!-- //하단 고정버튼 -->
        </div>
    </div><!-- // container -->
</div><!-- // wrap -->
</body>
</html>
