<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>요기요 날짜 선택</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/css/beple_ygy.css">
  <link rel="stylesheet" href="../assets/resource/css/beple_header.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPG-YGYO-10-10-S">
<!-- 헤더 영역 -->
    <header class="header position-sticky flex-end"><!-- 단일버튼 우측정렬 일 경우 flex-end 클래스 추가 -->
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title">날짜 선택</h1>
        </div>
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="BPG-YGYO-10-10-S-e12" href="#none" class="hd-btn close"><span class="blind-i">나가기</span></a>
        </nav>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap">
        <!-- 캘린더 -->
        <section class="calendar-container">
            <article class="calendar-header">
                <div class="calendar__info-box">
                    <p class="calendar__info-text">선택일자</p>
                    <p class="calendar__info-text fw-extra">2023.09.09</p>
                </div>
                <div class="month-box">
                    <p class="month-btn prev"><button data-element-id="BPG-YGYO-10-10-S-e07" type="button" class="icon arr_left-22"><span class="blind-i">이전</span></button></p>
                    <h2 class="tit"><button data-element-id="BPG-YGYO-10-10-S-e08" type="button"><span>2023</span>년 <span>09</span>월</button></h2>
                    <p class="month-btn next"><button data-element-id="BPG-YGYO-10-10-S-e09" type="button" class="icon arr_right-22"><span class="blind-i">다음</span></button></p>
                </div>
            </article>
            <article class="calendar-con">
                <div class="week-head">
                    <p class="week"><span>월</span></p>
                    <p class="week"><span>화</span></p>
                    <p class="week"><span>수</span></p>
                    <p class="week"><span>목</span></p>
                    <p class="week"><span>금</span></p>
                    <p class="week"><span>토</span></p>
                    <p class="week"><span>일</span></p>
                </div>
                <div class="day-container">
                    <p class="day select"><button type="button"><span>1</span></button></p><!-- 선택 시 select -->
                    <p class="day"><button type="button"><span>2</span></button></p>
                    <p class="day"><button type="button"><span>3</span></button></p>
                    <p class="day sold-out"><button type="button"><span>4</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day"><button type="button"><span>5</span></button></p>
                    <p class="day"><button type="button"><span>6</span></button></p>
                    <p class="day"><button type="button"><span>7</span></button></p>
                    <p class="day"><button type="button"><span>8</span></button></p>
                    <p class="day"><button type="button"><span>9</span></button></p>
                    <p class="day"><button type="button"><span>10</span></button></p>
                    <p class="day"><button type="button"><span>11</span></button></p>
                    <p class="day"><button type="button"><span>12</span></button></p>
                    <p class="day"><button type="button"><span>13</span></button></p>
                    <p class="day"><button type="button"><span>14</span></button></p>
                    <p class="day"><button type="button"><span>15</span></button></p>
                    <p class="day"><button type="button"><span>16</span></button></p>
                    <p class="day"><button type="button"><span>17</span></button></p>
                    <p class="day"><button type="button"><span>18</span></button></p>
                    <p class="day"><button type="button"><span>19</span></button></p>
                    <p class="day"><button type="button"><span>20</span></button></p>
                    <p class="day"><button type="button"><span>21</span></button></p>
                    <p class="day"><button type="button"><span>22</span></button></p>
                    <p class="day"><button type="button"><span>23</span></button></p>
                    <p class="day sold-out"><button type="button"><span>24</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day sold-out"><button type="button"><span>25</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day sold-out"><button type="button"><span>26</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day sold-out"><button type="button"><span>27</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day sold-out"><button type="button"><span>28</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day sold-out"><button type="button"><span>29</span></button></p><!-- 마감 시 sold-out -->
                    <p class="day sold-out"><button type="button"><span>30</span></button></p><!-- 마감 시 sold-out -->
                </div>
            </article>
        </section>
        <!-- // 캘린더 -->

        <!-- 플로팅 박스 -->
        <section class="floating-container bottom">
            <article class="main_btn-box bg-white">
                <div class="btn-main flex-row">
                    <button data-element-id="BPG-YGYO-10-10-S-e10" type="button" class="btn-default btn-line radius-mid btn-style-h48 short">초기화</button>
                    <button data-element-id="BPG-YGYO-10-10-S-e11" type="button" class="btn-default radius-mid btn-style-h48 long mgl8 on">적용하기</button><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                </div>
            </article>
        </section>
    </main>
</body>
</html>
