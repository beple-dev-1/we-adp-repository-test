<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>기타 주소 (edit)</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/css/beple_ygy.css">
  <link rel="stylesheet" href="../assets/resource/css/beple_header.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPG-YGYO-40-10-S">
<!-- wrap -->
	<div class="wrap">
		<div class="header floating-back-header floating-sticky">
			<h1>주소 편집</h1>
			<a data-element-id="BPG-YGYO-40-10-S-e02" class="btn-history-back" id="btnBack">뒤로가기</a>
		</div>
		<!-- // header -->
		<!-- container -->
		<div class="container">
			<!-- content -->
			<div class="content">
				<div class="bp-ygy flexWrap">
					<!-- 
						각 화면별 페이지에 맞게 클래스 넣어주세요.

						Y130주소편집, Y132주소선택 	= address
						Y130주소관리, Y131주소검색 	= address sch (페이지 타이틀 직후에 검색창으로 시작할 때)
						Y133현재위치확인 = location
					-->
					<div class="address">
						<!-- 주소목록 -->
						<div class="address__content edit-mode"><!-- 주소 편집 시 edit-mode 클래스 추가(수정/삭제 버튼 생성) -->
							<div class="border-t10">
								<div class="address__list set">
									<ul id="addrsMarkListArea"><!-- sample:begin -->서울 강남구 테헤란로 1길 10<!-- sample:end --></ul>
								</div>
							</div>
							<!-- 최근 배달 주소 -->
							<!-- 최근 배달 주소 없을 시 영역 전체 삭제 - 추가/제거로 인한 상단 박스 스타일 변화 있습니다. -->
							<div class="border-t10">
								<h2 class="address__tit">기타 주소</h2>
								<div class="address__list">
									<ul id="addrsListArea"><!-- sample:begin --><li class="select"><div class="address__con"><a onclick="selectDefault(서울 강남구 테헤란로 1길 10,this);"><p class="adress-name">서울 강남구 테헤란로 1길 10 서울 강남구 테헤란로 1길 10 홍길동  101동 1001호</p><p class="adress-more">서울 강남구 테헤란로 1길 10 서울 강남구 테헤란로 1길 10   101동 1001호</p><p class="adress-name"><span>101동 1001호</span></p><p class="adress-more"><span>[지번] 101동 1001호</span></p></a><div class="edit"><button class="address__edit-btn" onclick="changAddr(서울 강남구 테헤란로 1길 10,'Y');">수정</button><button class="address__edit-btn del" onclick="deleteAddr(서울 강남구 테헤란로 1길 10);">삭제</button></div></div></li><!-- sample:end --></ul>
								</div>
							</div>
							<!-- // 최근 배달 주소 -->
						</div>
						<!-- // 주소목록 -->
					</div>
				</div>
			</div>
			<!-- // content -->
		</div>
		<!-- // container -->
	</div>
	<!-- // wrap -->
</body>
</html>
