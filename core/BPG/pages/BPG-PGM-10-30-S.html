<head>

<body data-screen-id="BPG-PGM-10-30-S">
<script>

    const inputList = ${inputList};

<form id="frm" name="frm" method="post">
    
        <input type="hidden" name="${item.key}" value="표본">

<div com-step-id="step3">
    <div class="wrap">

            <h1>계좌 등록</h1>
        </div><!-- // header -->
        <div class="container">
            <div class="content">
                <div class="account addBtn-pb48">
                    <div class="regist_w">
                        <p class="acc_msg">
                            <strong class="txt_bold">계좌번호를 입력하고 ARS 인증을 진행해 주세요.</strong>
                            <input type="hidden" id="sec_bank_cd" />
                        </p>
                        <div class="ipt_section">
                            <div class="ipt_w">
                                <h2 class="ipt_tit">은행명</h2>
                                <div class="ipt_bx">
                                    <input data-element-id="BPG-PGM-10-30-S-e08" type="text" id="sec_bank_nm" aria-readonly readonly>
                                </div>
                            </div>
                            <div class="ipt_w">
                                <h2 class="ipt_tit">계좌번호</h2>
                                <div class="ipt_bx">
                                    <input data-element-id="BPG-PGM-10-30-S-e09" id="account-number" type="tel" placeholder="-없이 입력" maxlength="20"  jex-input="onlyNumber"/>
                                </div>
                            </div>
                            <div class="ipt_w">
                                <h2 class="ipt_tit">이름</h2>
                                <div class="ipt_bx">
                                    <input data-element-id="BPG-PGM-10-30-S-e10" id="name" type="text" maxlength="10" value="홍길동" aria-readonly readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- ARS안내 -->
                    <div class="ars_info">
                        <div class="bg_box">
                            <p>
                                안전한 계좌 등록을 위해 ARS 전화를 받고<br>
                                생년월일 6자리를 입력하세요.
                            </p>
                        </div>
                        <div class="noti">
                            <p>
                                ARS 음성메시지 청음이 어려우신 경우 전화 연결 상태에서 생년월일 6자리 입력 시 인증 완료됩니다.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row-bothpadding25-style" style="margin-top:25px;">
                <span id="span_txt" style="color:red;"></span>
            </div>
            <div class="fixed-bottom-section">
                <a data-element-id="BPG-PGM-10-30-S-e07" id="acct_Confirm" class="btn-submit btn-style-h48 btn-skyBlue"><span>ARS 인증 요청</span></a>
