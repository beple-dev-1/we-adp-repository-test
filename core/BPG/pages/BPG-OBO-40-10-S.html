<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>비플오더 메뉴관리 원산지 수정</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPG-OBO-40-10-S">
<form name = "frm" id = "frm" method="post">
		<input id="BP_AFLT_SEQ" name = "BP_AFLT_SEQ" type="hidden" value="">
	</form>
	<div class="wrap bg_f7">
		<div class="header floating-back-header floating-sticky">
			<h1>원산지</h1>
			<a data-element-id="BPG-OBO-40-10-S-e04" class="btn-history-back">뒤로가기</a>
		</div>
		<!-- // header -->
		<div class="container">
			<div class="content">
				<div class="bpleOder addBtn-pb58">
					<!-- 매장소개 등록 -->
					<div class="store_profile">
						<div class="tit_bx font_small">
							<h2>
								<strong>원산지 정보 입력</strong>
							</h2>
							<p>등록된 메뉴의 원산지 정보를 입력해 주세요.</p>
						</div>
						<div class="oder_set_more">
							<div class="text_box_t1"><!-- 텍스트박스 입력 시작 시 active 클래스 추가(tip 텍스트 영역 제거용) -->
								<div class="tx_area">
									<textarea data-element-id="BPG-OBO-40-10-S-e06" id="originInfo" maxlength="500"  placeholder="ex) 원두(브라질, 코스타리카, 콜롬비아)" ></textarea>
								</div>
								<p class="txt_count"><span>0/</span>500</p>
							</div>
						</div>
					</div>
					<!--//매장소개 등록 -->
				</div>
	
				<!-- 하단 고정버튼 -->
				<div class="btn_botFix_w bg_f7">
					<div class="inner bg_grey">
						<a data-element-id="BPG-OBO-40-10-S-e05" id="btn_save" class="btn_default btn-style-h48 round_r8 on"><span>저장</span></a><!-- 활성화 시 on 클래스 추가 -->
					</div>
				</div>
				<!-- //하단 고정버튼 -->
			</div>
		</div><!-- // container -->
	</div><!-- // wrap -->
</body>
</html>
