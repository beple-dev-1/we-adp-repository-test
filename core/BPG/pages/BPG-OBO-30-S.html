<!DOCTYPE html>

<body data-screen-id="BPG-OBO-30-S">
<form name = "frm" id = "frm" method="post">

	<!-- wrap -->

		<div class="container">
			<!-- content -->
			<div class="content">
				<!-- 비플오더 -->
				<div class="flexWrap">
					<div class="bpleOder add_flex_column auto_bot_pd"><!-- 등록 옵션 없을 시 auto_bot_pd, 그 외 addBtn-pb56 -->

							<a data-element-id="BPG-OBO-30-S-e08" data-nav-target="BPG-OBO-20-S" href="#" onclick="Common.simpleSubmit('bo_my_catg.act', {BP_AFLT_SEQ:''});return false;"><span>카테고리</span></a>

							<a data-element-id="BPG-OBO-30-S-e13" href="#" onclick="return false;" class="on"><span>옵션</span></a><!-- 선택 시 on 클래스 추가 -->
							<a data-element-id="BPG-OBO-30-S-e10" data-nav-target="BPG-OBO-40-S" href="#" onclick="Common.simpleSubmit('bo_my_orgin.act', {BP_AFLT_SEQ:''});return false;"><span>원산지</span></a>
						</div>
						<!-- 메뉴관리 컨텐츠 -->
						<div class="menu_admin">
							<div class="menu_option_add" id="opt_div"><!-- sample:begin --><div class='menu_option_list'><h3 class='tit'>홍길동</h3><p>15,000</p><dl class='chain_menu'><dt>연결메뉴</dt><dd>아메리카노 T</dd></dl><p class='modify_btn'><a onclick='uf_optSet(`1`,this);'><span class='blind'>메뉴수정</span></a></p></div><div class='menu_option_list'><h3 class='tit'>홍길동</h3><p>15,000</p><dl class='chain_menu'><dt>연결메뉴</dt><dd>아메리카노 T</dd></dl><p class='modify_btn'><a onclick='uf_optSet(`1`,this);'><span class='blind'>메뉴수정</span></a></p></div><!-- sample:end --></div>
							<!-- 카테고리 / 메뉴 / 원산지 추가 버튼 -->
							<p class="btn_add" id="btn_add" style="display:none">
								<a data-element-id="BPG-OBO-30-S-e14" href="#none">+ 옵션 추가</a>

						<dt>‘옵션’은 무엇인가요?</dt>
						<dd>
							옵션은 메뉴의 세부 항목 영역입니다. Ice, Hot 같이 고객이 고를 수 있는 맛, 타입 등을 추가해 주세요. ‘연결 메뉴 추가’를 통해 쉽게 메뉴와 옵션을 연결할 수 있어요.

					</dl>
				</div>
				<!-- 버튼 -->
				<div class="inner">
					<a data-element-id="BPG-OBO-30-S-e11" data-nav-target="BPG-OBO-10-S" onclick="Common.simpleSubmit('bo_my_main.act', {BP_AFLT_SEQ:''});" class="btn_default btn-style-h46 round_r8 on"><!-- 활성화 시 on 클래스 추가 -->

						<li><a id="btn_del">옵션 삭제</a></li>

				<!-- //설정팝업 -->
			</div>
		</div>
