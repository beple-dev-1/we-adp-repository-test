<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>로봇배송 장소 안내</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_beple.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_beple_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/beple_popup.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
</head>
<body data-screen-id="HIT-ORDR-22-40-S">
<div class="wrap">
    <!-- 헤더 -->
    <header class="header position-sticky" style="display: none">
        <nav class="header__navi">
            <a data-element-id="HIT-ORDR-22-40-S-e03" href="#none" class="header__btn btn-back">
                <span class="blind">이전페이지로</span>
            </a>
        </nav>

        <!-- 헤더 타이틀(페이지 이름) - 어떤 경우에도 header__title-wrap 삭제 금지. -->
        <div class="header__title-wrap">
            <h1 class="page-name"><span>Header Title</span></h1>
        </div>

        <nav class="header__navi">
            <a data-element-id="HIT-ORDR-22-40-S-e04" href="#none" class="header__btn btn-close">
                <span class="blind">페이지 닫기</span>
            </a>
        </nav>
    </header>

    <main class="container-wrap js-container-wrap">

    </main>

    <!-- 컨테이너 - 이용안내 팝업 -->
    <div class="popup-wrap js-popup-wrap active">
        <section class="popup-container popup--full">
            <!-- 헤더 -->
            <header class="header position-sticky">
                <div class="header__title-wrap">
                    <h1 class="page-name"><span>이용안내</span></h1>
                </div>

                <nav class="header__navi">
                    <a href="#none" class="header__btn btn-close js-popup-close">
                        <span class="blind">페이지 닫기</span>
                    </a>
                </nav>
            </header>

            <div class="popup-container__body smart_oder-container">
                <section class="body__header justify-spacing-def pdt24">
                    <h2 class="headline headline--lv4">
                        로봇 배송을 받을 수 있는 장소 중 <br>
                        배송 받으실 장소를 확인해 주세요.
                    </h2>
                </section>

                <section class="body__content oder_payment">
                    <div class="payment_w">
                        
                            

                                <div class="payment_con">
                                    <div class="con-hd">
                                        <div class="flex-row">
                                            <h3 class="pay_tit">홍길동</h3>
                                        </div>
                                    </div>

                                    <div class="delivery-place">
                                        <div class="delivery-place__view">
                                            <img class="${item.areaImgClass}" src="../assets/_sample/menu.svg"><!-- 빈 이미지 일 시 해당 img 태그(svg경로 포함된)와 empty 클래스 추가 / 이미지 변경 시 empty 클래스 제거 -->
                                        </div>
                                    </div>
                                </div>
                            
                        
                        
                            <div class="payment_con">
                                <div class="con-hd">
                                    <div class="flex-row">
                                        <h3 class="pay_tit">조회된 장소가 없습니다.</h3>
                                    </div>
                                </div>

                                <!--<div class="delivery-place">
                                    <div class="delivery-place__view">
                                        <img src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='1' height='1'&gt;&lt;rect fill='rgba(0,0,0,0)' x='0' y='0' width='100%'/&gt;&lt;/svg&gt;" class="empty"> 
                                    </div>
                                </div>-->
                            </div>
                        
                    </div>
                </section>
            </div>
        </section>
    </div>
    <!-- // 컨테이너 - 이용안내 팝업 -->
</div>
</body>
</html>
