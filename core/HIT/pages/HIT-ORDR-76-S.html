<!DOCTYPE html>

<head>

  <title>스마트오더 도난신고</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-ORDR-76-S">
<form name="frm" id="frm" method="post">
    <input type="hidden" name="ORDER_DT"                id="ORDER_DT"               value="">
    <input type="hidden" name="ORDER_ID"                id="ORDER_ID"               value="">
    <input type="hidden" name="DELV_DT"                 id="DELV_DT"                value="">
    <input type="hidden" name="MENU_AMT"                id="MENU_AMT"               value="">
    <input type="hidden" name="MENU_NM"                 id="MENU_NM"                value="">
    <input type="hidden" name="QTY"                     id="QTY"                    value="">
    <input type="hidden" name="ORDER_TOT_AMT"           id="ORDER_TOT_AMT"          value="">
    <input type="hidden" name="ORDER_TYPE"              id="ORDER_TYPE"             value="O">
    <input type="hidden" name="AFLT_NM"                 id="AFLT_NM"                value="">
</form>

<div class="wrap js-wrap">
    <!-- 헤더 영역 -->
    <header class="header position-sticky">
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="HIT-ORDR-76-S-e05" data-nav-target="HIT-HIST-10-20-S" href="#none"class="hd-btn back" onclick="uf_back();"><span class="blind-i">뒤로가기</span></a>
        </nav>
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title">도난신고하기</h1>
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 컨테이너 -->
        <section class="smart_oder-container">
            <!-- 신규추가 -->
            <div class="container-hd type2 flex-column pdt16">
                <h2 class="container-text title large ns-ac"></h2>
                <!-- 주문정보 -->
                <div class="hd__text-wrap">
                    <div class="text-item">
                        <p class="container-text head">주문 번호</p>
                        <p class="container-text"></p>
                    </div>
                    <div class="text-item">
                        <p class="container-text head">주문 일자</p>
                        <p class="container-text">년 월 일</p>
                    </div>
                    <div class="text-item">
                        <p class="container-text head">배송 일자</p>
                        <p class="container-text">년 월 일</p>
                    </div>
                </div>
            </div>
            <!-- // 신규추가 -->

            <!-- 주문상태 -->
            <article class="oder_state_dtl" style="display: none;"><!-- 도난 신고 시 theft 클래스 추가 / 불필요 시 style="display: none" 추가(스타일 적용되어 있음) -->
                <p class="oder_num">주문번호<strong>A123456789</strong></p>
                <div class="progress_bar step1"><!-- 각 스탭별 클래스 step 1~3 -->
                    <div class="anchor"><span>주문완료</span></div>
                    <div class="anchor"><span>접수완료</span></div>
                    <div class="anchor"><span>제조완료</span></div>
                </div>
                <p class="refresh_btn"><a data-element-id="HIT-ORDR-76-S-e06" href="#none">새로고침</a></p>
                <!-- 도난신고 라벨 추가 -->
                <p class="theft-label"><span href="#none">도난신고</span></p>
                <!-- // 도난신고 라벨 추가 -->
            </article>

            <!-- 주문내역 -->
            <article class="oder_cart border-t10">
                <div class="cart_w">
                    <!-- wrap-hd 및 버튼 추가됨 -->
                    <div class="wrap-hd flex-row">
                        <h2 class="tit grow-y">주문내역</h2>
                        <!-- <a href="#none" class="text-btn shrink-n"><span class="icon arr_right-14">영수증 상세내역</span></a> -->
                    </div>
                    <!-- // wrap-hd 추가됨 -->
                    <div class="list_w">
                        <!-- 목록 -->
                        <div class="list">
                            <h3 class="name"> 1개</h3>
                            <div class="detail flex-column">
                                <div class="detail-con flex-row justify-space">
                                    <p class="detail-text">주문금액</p>
                                    <p class="detail-text">4,500원</p>
                                </div>
                                
                                <div class="detail-con flex-row justify-space">
                                    <p class="detail-text"></p>
                                    <p class="detail-text">-<span>4,500</span>원</p>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </article>
            <!-- 구조 변경됨 -->
            <!-- 결제상세 -->
            <article class="oder_payment">
                <div class="payment_w">
                    <!-- 도난신고 입력영역 - 폼 박스 추가 -->
                    <div class="payment_con form-box">
                        <!-- 헤더 -->
                        <div class="box-hd flex-row justify-space">
                            <p class="form-label">도난 신고 내용(선택)</p>
                            <p class="form-txt-count"><strong id="real_cnt">0</strong>/<span>100</span></p>
                        </div>
                        <!-- 컨텐츠 -->
                        <div class="form-item form-textarea hint">
                            <textarea data-element-id="HIT-ORDR-76-S-e08" id="review" onkeyup="review_text()" maxlength="100" placeholder="딜리버리 도난 신고 관련 내용을 간략히 적으세요."></textarea>
                            <!-- 힌트 txt -->
                            <p class="hint-txt">
                            </p>
                        </div>
                    </div>
                    <!-- // 도난신고 입력영역 - 폼 박스 추가 -->
                </div>
            </article>
            <!-- // 구조 변경됨 -->
        </section>
        <!-- 플로팅 박스 -->
        <section class="floating-container bottom js-floating-wrap">
            <!-- 메인 버튼영역 -->
            <article class="main_btn-box bg-white">
                <div class="btn-main">
                    <a data-element-id="HIT-ORDR-76-S-e07" href="#none" class="btn-default radius-mid btn-style-h48 on" id="btn_save">신고하기</a><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
