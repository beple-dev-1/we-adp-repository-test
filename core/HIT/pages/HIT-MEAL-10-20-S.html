<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>식수 신청작성(본인)</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-MEAL-10-20-S">
<div class="wrap js-wrap">
    	<form id="frm" name="frm">
				<!-- <input type="hidden" id="USER_DATA"	name="USER_DATA" value='' /> -->
				<input type="hidden" name="BLOCK_LAST_DATE" id="BLOCK_LAST_DATE" value="">
				<input type="hidden" name="SEND_DATE_INPUT" id="SEND_DATE_INPUT" value="">
				<input type="hidden" name="CUR_WORK" id="CUR_WORK" value="">
				<input type="hidden" name="RES_MSG" id="RES_MSG" value="">
		</form>
		
        <!-- 헤더 영역 -->
        <header class="header position-sticky">
            <!-- 헤더 네비 -->
            <nav class="header-nav">
                <a data-element-id="HIT-MEAL-10-20-S-e08" href="javascript:uf_back();" class="hd-btn back"><span class="blind-i">뒤로가기</span></a>
            </nav>
            <!-- 헤더 타이틀 -->
            <div class="page-title">
                <h1 class="header-title">식수 신청</h1>
            </div>
        </header>

        <!-- 컨텐츠 영역 -->
        <main class="container-wrap js-container-wrap">
            <!-- 식수신청 -->
            <section class="orderling-container">
                <!-- 컨테이너 헤더 -->
                <div class="container-hd">
                    <h2 class="container__hd-title">식수 신청 정보</h2>
                </div>
                <!-- 컨테이너 컨텐츠 -->
                <article class="orderling__item-wrap">
                    <!-- 이용 일자 -->
                    <div class="form-box">
                        <!-- 헤더 -->
                        <div class="box-hd">
                            <p class="form-label">이용 일자</p>
                        </div>
                        <div class="box-con">
                            <!-- 컨텐츠 -->
                            <div class="form__item-wrap"><!-- 2개 이상일 시 btn-add 클래스 추가 -->
                                <!-- 신청일자 -->
                                <div class="form-item form-btn form-calendar placeholder" id="start_headcnt_go_date"><!-- 날짜 지정 이전 힌트문구 일 시 placeholder 클래스 추가 -->
                                    <a data-element-id="HIT-MEAL-10-20-S-e09" class="icon calendar-16"><span class="tx_ellipsis" id="start_headcnt_date" >시작일자 선택</span></a>
                                </div>
                                <!-- 신청일자 -->
                                <div class="form-item form-btn form-calendar placeholder" id="end_headcnt_go_date">
                                    <a data-element-id="HIT-MEAL-10-20-S-e10" class="icon calendar-16"><span class="tx_ellipsis" id="end_headcnt_date" >종료일자 선택</span></a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-box">
                        <!-- 박스 헤더 -->
                        <div class="box-hd">
                            <p class="form-label">신청 근무지</p>
                        </div>
                        <!-- 박스 컨텐츠 -->
                        <div class="form-item form-btn"><!-- 근무지 선택 시 placeholder 클래스 삭제 -->
                            <a href="#none" class="icon arr_bottom2-16" onclick="headcntWorkCdOpen();"><span id="workNm"><!-- sample:begin -->홍길동<!-- sample:end --></span></a>
                        </div>
                    </div>

                    <!-- 신청 사유 -->
                    <div class="form-box">
                        <!-- 헤더 -->
                        <div class="box-hd flex-row justify-space">
                            <p class="form-label">식수 신청 사유</p>
                            <p class="form-txt-count"><strong id="real_cnt">0</strong>/<span>200</span></p>
                            
                        </div>
                        <!-- 컨텐츠 -->
                        <div class="form-item form-textarea hint"><!-- 입력 시 hint 클래스 제거 / 내용 전부 삭제 시 hint 클래스 추가 -->
                            <textarea data-element-id="HIT-MEAL-10-20-S-e12" name="headcnt_reason" id="headcnt_reason" maxlength="200" ></textarea>
                            <!-- 힌트 txt -->
                            <p class="hint-txt">신청 사유를 입력해 주세요.</p>
                        </div>
                    </div>
                </article>
            </section>

            <!-- 플로팅 박스 -->
            <section class="floating-container bottom js-floating-wrap">
                <!-- 메인 버튼영역 -->
                <article class="main_btn-box bg-white">
                    <div class="btn-main">
                        <a data-element-id="HIT-MEAL-10-20-S-e11" href="javascript:goHeadCntCreate();" class="btn-default radius-mid btn-style-h48" id="btnMain">신청하기</a><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                    </div>
                </article>
            </section>
        </main>
        
        
        
          <main class="container-wrap js-container-wrap"  id ="work_cd_view" style="display: none;" >
            <!-- 레이어팝업 -->
            <section class="popup-container overlay" style="display:none;">
                <div class="popup-box bottom">
                    <div class="inner-box">
                        <!-- 컨테이너 헤더 -->
                        <div class="box-hd pd-lr20 pdt24">
                            <p class="box__hd-text">신청 근무지</p>
                        </div>
                        <!-- 컨테이너 컨텐츠 -->
                        <article class="box-content pd-lr20 mgt16 max_height-200 scroll-y" id="work_cd_list">
                            <!-- <p class="popup__text"><button type="button" class="text-btn pdr34 select"><span class="tx_ellipsis">양재</span></button></p>현재 설정된 근무지 select pdr34 클래스 추가
                            <p class="popup__text"><button type="button" class="text-btn"><span class="tx_ellipsis">강남대로</span></button></p> -->
                            
                        </article>
                        <!-- 닫기버튼 -->
                        <p class="close_btn-box"><button data-element-id="HIT-MEAL-10-20-S-e07" type="button" class="close-btn icon close-14" onclick="headcntWorkCdClose();"><span class="blind-i">팝업닫기</span></button></p>
                    </div>
                </div>
            </section>
            <!-- // 레이어팝업 -->
        </main>
        
    </div>
</body>
</html>
