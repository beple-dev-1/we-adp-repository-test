<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>엔터프라이즈_가맹점 어드민_가맹점 선택(앱 버전)</title>
  <link rel="stylesheet" href="../assets/ent_aflt_resource/css/heat_admin-mobile.css">
</head>
<body data-screen-id="HIT-MBOA-10-10-10-S">
<div class="app app--login">
    <header class="ds-appbar">
      <button class="ds-appbar__action ds-appbar__action--leading" aria-label="뒤로"><img src="../assets/ent_aflt_resource/img/icons/ico-arrow-left.svg" width="32" height="32" alt="" /></button>
      <span class="ds-appbar__title"></span>
    </header>
    <div class="login-body">
      <h2 class="login-section-title"><!-- copy: login.store.title -->가맹점 선택</h2>
      <p class="desc"><!-- copy: login.store.desc -->관리하실 가맹점을 선택해 주세요.</p>
      <div class="store-card-list" role="radiogroup" aria-label="가맹점 선택">
        
        <label class="store-card" aflt_seq="" name="afltSeq">
          <input type="hidden" name="aflt_seq" value="">
          <input class="store-card__input" type="radio" name="aflt" value="" />
          <span class="store-card__info">
            <span class="store-card__name"></span>
            <span class="store-card__addr">서울 강남구 테헤란로 1길 10</span>
          </span>
          <span class="store-card__check"><img src="../assets/ent_aflt_resource/img/icons/ico-check-default.svg" width="24" height="24" alt="" /></span>
        </label>
        
      </div>
    </div>
    <div class="login-footer">
      <button data-element-id="HIT-MBOA-10-10-10-S-e02" id="confirm" class="ds-button ds-button--primary ds-button--block ds-button--xlarge ds-button--disabled"><!-- copy: cm.confirm -->확인</button>
    </div>
  </div>
<!--   -->
</body>
</html>
