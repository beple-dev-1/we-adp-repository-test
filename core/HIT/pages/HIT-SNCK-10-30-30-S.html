<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>다과 예약 신청 (require)</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-SNCK-10-30-30-S">
<div class="wrap js-wrap" >
    <header class="header position-sticky">
        <nav class="header-nav">
            <a data-element-id="HIT-SNCK-10-30-30-S-e04" class="hd-btn back" id='btnBack'><span class="blind-i">뒤로가기</span></a>
        </nav>
        <div class="page-title">
            <h1 class="header-title">다과 예약 신청</h1>
        </div>
        <nav class="header-nav">
        </nav>
    </header>

    <!-- 컨텐츠 영역 -->
        <main class="container-wrap js-container-wrap">
            <!-- 다과 신청 -->
            <section class="orderling-container">
                <!-- 컨테이너 헤더 -->
                <div class="container-hd">
                    <h2 class="container__hd-title">주문 정보 확인</h2>
                    <p class="container__hd-text">신청하신 다과를 확인해 주세요.</p>
                </div>
            </section>
            <!-- 상세 내역 -->
            <section class="orderling-container detail">
                <!-- 컨테이너 헤더 -->
                <div class="container-hd sub-title">
                    <h2 class="container__hd-title">주문 정보 확인</h2>
                </div>
                <!-- 컨테이너 컨텐츠 -->
                <article class="orderling__item-wrap detail-wrap">
                    <!-- 상세내역 -->
                    <div class="orderling__derail-box">
                        <!-- 컨텐츠 -->
                        <div class="detail-item">
                            <div class="detail-list">
                                <!-- 주문 상세 내역 -->
                                <ul class="list-bar">
                                </ul>
                            </div>
                            <!-- 총 주문 예상금액 -->
                            <div class="detail-total">
                                <p class="shrink-n">총 주문 예상금액</p>
                                <p class="grow-y tar"><strong id='totPriceList'>0</strong>원</p>
                            </div>
                        </div>
                    </div>
                </article>
            </section>
            <!-- 요청사항(선택) -->
            <section class="orderling-container detail">
                <!-- 컨테이너 헤더 -->
                <div class="container-hd sub-title">
                    <h2 class="container__hd-title" >요청사항(선택)</h2>
                </div>
                <!-- 컨테이너 컨텐츠 -->
                <article class="orderling__item-wrap detail-wrap mgt20">
                    <div class="form-box">
                        <!-- 컨텐츠 -->
                        <!-- 체크박스 -->
                        <div class="form__item-wrap flex-column">
                            <div class="form-item form-checkbox"><label><input  type="checkbox"><span>셋팅 요청드려요.</span></label></div>
                            <div class="form-item form-checkbox"><label><input  type="checkbox"><span>회수 요청드려요.</span></label></div>
                            <div class="form-item form-checkbox"><label><input  type="checkbox"><span>서빙 요청드려요.</span></label></div>
                            <div class="form-item form-checkbox"><label><input  type="checkbox"><span>임원이 참석하세요.</span></label></div>
                        </div>
                        <!-- 텍스트 박스 -->         
                        <div class="form-item form-textarea height-140 mgt16 hint" id='hintArea'><!-- 입력 시 hint 클래스 제거 -->
                            <textarea data-element-id="HIT-SNCK-10-30-30-S-e06" name="requirementArea" id="requirementArea"></textarea>
                            <!-- 힌트 txt -->
                            <p class="hint-txt">
                                요청사항을 입력해 주세요.<br>
                                ex) 셋팅 요청시간 : 9시 30분, 회수 요청시간 10시 30분<br>
                                특이사항 : '비건', '알러지', '할랄'등<br>
                                ※ 정규 중식 배식시간(11:20~13:00)에는 셋팅 및 퇴식이 불가능하오니 양해 부탁드립니다.
                            </p>
                            <p class="form-txt-count"><strong id='chekCount'>0</strong>/<span>500</span></p>
                        </div>
                    </div>
                </article>
            </section>

            <!-- 플로팅 박스 -->
            <section class="floating-container bottom js-floating-wrap  js-floating-wrap">
                <!-- 메인 버튼영역 -->
                <article class="main_btn-box bg-white">
                    <div class="btn-main">
                        <a data-element-id="HIT-SNCK-10-30-30-S-e05" onclick='nextStep()' class="btn-default radius-mid btn-style-h48 on"><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                            다음
                        </a>
                    </div>
                </article>
            </section>
            <!-- // 2023-10-23 -->
        </main>
    </div>
</body>
</html>
