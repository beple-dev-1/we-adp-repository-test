            <h1 class="page-name"><span>메뉴상세</span></h1>
        </div>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">

        <section class="smart_oder-container">
            <!-- 컨테이너 컨텐츠 -->

                [D]

                품절 : sold-out, 해당 상태일 때 aria-label ="품절" 추가
                준비중 : waiting,  해당 상태일 때 aria-label ="준비중" 추가
                닫힘 : close 해당 상태일 때 aria-label ="닫힘" 추가

            -->
            <article class="menu_detail">
                <!-- 사진 -->
                <div class="m_photo">
                    <p id="menuImg"><a data-element-id="HIT-ORDR-40-S-e13" href="#none"><img onerror="noImage($(this))" alt="메뉴 이미지" src="../assets/_sample/card.svg"></a></p><!-- 2023-12-27 a 태그 추가 -->

                <div class="m_info">

                    <!--<div class="label-wrap" style="display: none;">

                    </p>

                        <p class="description ellipsis-line--3">
                            
                        </p>

                        <!-- 슬라이드 이미지 영역 -->
                        <div class="swiper-wrapper">
                            <div class="swiper-slide">
                                <div class="img">
                                    <img id="imgArea" alt="사진 상세보기" src="../assets/_sample/card.svg">
                                </div>

                            </div>
                        </div>
                        <!-- paging -->
                        <div class="swiper-pagination"></div>
                    </div>
                </div>
            </div>
        </section>
