<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>식수 신청_대상자정보입력</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-MEAL-20-30-S">
<div class="wrap js-wrap">
	<form id="frm" name="frm">
		<input type="hidden" id="MEMB_CD"	name="MEMB_CD"	/>
	</form>
    <!-- 헤더 영역 -->
    <header class="header position-sticky">
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="HIT-MEAL-20-30-S-e08" href="javascript:uf_back();" class="hd-btn back"><span class="blind-i">뒤로가기</span></a>
        </nav>
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title">식수 신청</h1>
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 식수신청 -->
        <section class="orderling-container" id="user_info">
            <!-- 컨테이너 헤더 -->
            <div class="container-hd">
                <h2 class="container__hd-title">대상자 정보</h2>
                <p class="container__hd-text">식수을 부여할 대상자 정보를 입력해 주세요.</p>
            </div>
            <!-- 컨테이너 컨텐츠 -->
            <article class="orderling__item-wrap"  id="user_list0">
                <!-- form box -->
                <div class="form-box">
                    <!-- 박스 헤더 -->
                    <div class="box-hd">
                        <p class="form-label">이름</p>
                    </div>
                    <!-- 박스 컨텐츠 -->
                    <div class="form-item form-input">
                        <input data-element-id="HIT-MEAL-20-30-S-e10" type="text" maxlength="30" placeholder="실명을 입력해 주세요." class="tx_ellipsis" id="headcnt_name" onkeyup="headCntUserCheck()">
                    </div>
                </div>
                <!-- form box -->
                <div class="form-box">
                    <!-- 박스 헤더 -->
                    <div class="box-hd">
                        <p class="form-label">전화번호</p>
                    </div>
                    <!-- 박스 컨텐츠 -->
                    <div class="form-item form-input">
                        <input data-element-id="HIT-MEAL-20-30-S-e11" type="tel" placeholder="휴대전화 번호를 입력해 주세요." maxlength="13" class="tx_ellipsis" oninput="autoHyphen(this)" id="headcnt_phone" onkeyup="headCntUserCheck()">
                    </div>
                </div>
                <!-- form box -->
                <div class="form-box">
                    <!-- 박스 헤더 -->
                    <div class="box-hd">
                        <p class="form-label">임시 출입카드 번호</p>
                    </div>
                    <!-- 박스 컨텐츠 -->
                    <div class="form-item form-input">
                        <input data-element-id="HIT-MEAL-20-30-S-e12" type="text" placeholder="출입 카드 번호를 입력해 주세요." class="tx_ellipsis" id="headcnt_card" onkeyup="headCntUserCheck()">
                    </div>
                </div>
                <div class="wrap-delete" style="display: none">
                        <button type="button" class="delete-btn icon btn_x-12" onclick="deleteUser('0');"><span class="blind-i">영역 삭제</span></button>
                    </div>
            </article>
        </section>
		<!-- 추가하기 버튼 -->
           <div class="content_btn-box">
               <button data-element-id="HIT-MEAL-20-30-S-e07" type="button" class="content-btn btn-style-h42" id="addUser"><span>+ 사용자 추가하기</span></button>
           </div>
        <!-- 플로팅 박스 -->
        <section class="floating-container bottom js-floating-wrap">
            <article class="main_btn-box bg-white">
                <div class="btn-main">
                    <!-- <a href="javascript:goHeadCntMainRequest();" class="btn-default radius-mid btn-style-h48" id="btnMain">신청하기</a>비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                    <a data-element-id="HIT-MEAL-20-30-S-e09" href="javascript:goHeadCntRequestTimeChk();" class="btn-default radius-mid btn-style-h48" id="btnMain">신청하기</a><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                    
                    
                </div>
            </article>
        </section>
    </main>
    </div>
</body>
</html>
