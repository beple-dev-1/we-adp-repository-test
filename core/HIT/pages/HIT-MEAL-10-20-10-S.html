<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>식수신청_날짜선택</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-MEAL-10-20-10-S">
<div class="wrap js-wrap">
	<form id="frm" name="frm">
		<input type="hidden" name="BLOCK_LAST_DATE" id="BLOCK_LAST_DATE" value="">
		<input type="hidden" name="SEND_DATE_INPUT" id="SEND_DATE_INPUT" value="">
		<input type="hidden" id="USER_DATA"	name="USER_DATA" value='' />
	</form>
    <!-- 헤더 영역 -->
    <header class="header position-sticky flex-end"><!-- 단일버튼 우측정렬 일 경우 flex-end 클래스 추가 -->
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title" id="calendar_text">날짜 선택</h1>
        </div>
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="HIT-MEAL-10-20-10-S-e12" id='btnBack'class="hd-btn close"><span class="blind-i">나가기</span></a>
        </nav>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 캘린더 -->
        <section class="calendar-container">
            <article class="calendar-header">
                <div class="calendar__info-box">
                    <p class="calendar__info-text">선택일자</p>
                    <p class="calendar__info-text fw-extra" id='toDayTitle'><!-- sample:begin -->안내<!-- sample:end --></p>
                </div>
               <div class="month-box">
                    <p class="month-btn prev"><button data-element-id="HIT-MEAL-10-20-10-S-e07" type="button" onclick='movePrevMonth()' class="icon arr_left-22"><span class="blind-i">이전</span></button></p>
                    <h2 class="tit"><button data-element-id="HIT-MEAL-10-20-10-S-e08" type="button"><span id='cal_top_year'><!-- sample:begin -->2026<!-- sample:end --></span>년 <span id='cal_top_month'><!-- sample:begin -->10<!-- sample:end --></span>월</button></h2>
                    <p class="month-btn next"><button data-element-id="HIT-MEAL-10-20-10-S-e09" type="button" onclick='moveNextMonth()' class="icon arr_right-22"><span class="blind-i">다음</span></button></p>
                </div>
            </article>
            <article class="calendar-con">
               <div class="week-head">
                    <p class="week"><span>일</span></p>
                    <p class="week"><span>월</span></p>
                    <p class="week"><span>화</span></p>
                    <p class="week"><span>수</span></p>
                    <p class="week"><span>목</span></p>
                    <p class="week"><span>금</span></p>
                    <p class="week"><span>토</span></p>
                </div>
                <div class="day-container" id='cal_tab_new'><!-- sample:begin --><p class="day"></p><!-- sample:end --></div> 
            </article>
        </section>
        <!-- // 캘린더 -->

        <!-- 플로팅 박스 -->
           <section class="floating-container bottom js-floating-wrap">
            <article class="main_btn-box bg-white">
                <div class="btn-main flex-row">
                    <button data-element-id="HIT-MEAL-10-20-10-S-e10" type="button" onclick="reset()" class="btn-default btn-line radius-mid btn-style-h48 short">초기화</button>
                    <button data-element-id="HIT-MEAL-10-20-10-S-e11" type="button" onclick="dataSend()" class="btn-default radius-mid btn-style-h48 long on">적용하기</button><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                </div>
            </article>
        </section>
    </main>
    </div>
</body>
</html>
