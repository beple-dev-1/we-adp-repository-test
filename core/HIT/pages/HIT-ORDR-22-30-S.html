<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>스마트오더 결제완료(로봇배송 포함)</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_beple.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_beple_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/beple_popup.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
</head>
<body data-screen-id="HIT-ORDR-22-30-S">
<form name="frm" id="frm" method="post">
    
        <input type="hidden" name="${item.key}" value="">
    
    <input type="hidden" name="BIZ_CD_NM" value="SMT"/>
</form>

<div class="wrap js-wrap">
    <!-- 헤더 영역 -->
    <header class="header position-sticky js-heder">
        <!-- 헤더 타이틀 -->
        <div class="header__title-wrap">
            <!-- 페이지 명 미사용 시 page-name 태그 내용 빈값 or 주석 or 삭제 -->
            <h1 class="page-name"><span></span></h1>
        </div>
    </header>
    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 2025-08-28 [D] 구조변경 -->
        <!--결제성공-->
        <section id="successSection" class="container end-container end--payment js-container">
            <section class="body__content justify-space-def">
                <!-- 결제완료 - 헤더 -->
                <div class="payment__head">
                    <i class="icon icon--state_check-64"></i>
                    <h2 class="container__headline">
                        <p class="head-text"><strong class="storeNm">비플카페 강남점</strong>에서<br>
                            
                            <strong class="fc-primary"><span class="amt">15,000</span>원</strong>
                                을
                            결제했습니다.
                        </p>
                    </h2>
                </div>
                <!-- 결제완료 - 결제정보 -->
                <div class="payment__info">
                    <div class="flex-row">
                        <p class="info-head">가맹점</p>
                        <p class="info-data fw-600 fc-primary storeNm">비플카페 강남점</p>
                    </div>
                    <div class="flex-row">
                        <p class="info-head">결제일시</p>
                        <p class="info-data fw-600 fc-111 payTime">14:22</p>
                    </div>
                    <div class="flex-row">
                        <p class="info-head">주문형태</p>
                        <p class="info-data orderType">일반</p>
                    </div>
                </div>

                <button data-element-id="HIT-ORDR-22-30-S-e05" class="button" id="receiptBtn">
                    <span>전자영수증 보기</span><i class="icon icon--arrow-16"></i>
                </button>
            </section>
        </section>
        <!--결제실패-->
        <section id="failSection" class="container end-container end--payment js-container" style="display: none">
            <section class="body__content justify-space-def">
                <!-- 결제실패 - 헤더 -->
                <div class="payment__head">
                    <i class="icon icon--state_warning-64">결제 실패</i>
                    <h2 class="container__headline">
                        <p class="head-text"><strong class="storeNm">비플카페 강남점</strong>에서<br>
                            <strong class="fc-red"><span class="amt">15,000</span>원</strong>을 결제했습니다.
                        </p>
                    </h2>
                </div>

                <!-- 결제실패 - 결제정보 -->
                <div class="payment__info">
                    <div class="flex-row">
                        <p class="info-head">가맹점</p>
                        <p class="info-data fw-600 storeNm">비플카페 강남점</p>
                    </div>
                    <div class="flex-row">
                        <p class="info-head">결제일시</p>
                        <p class="info-data fw-600 fc-111 payTime">14:22</p>
                    </div>
                    <div class="flex-row">
                        <p class="info-head">주문형태</p>
                        <p class="info-data orderType">일반</p>
                    </div>
                    <div class="flex-row">
                        <p class="info-head">실패사유</p>
                        <p class="info-data fc-red" id="failReason">004:요청사항 없음</p>
                    </div>
                </div>

                <button data-element-id="HIT-ORDR-22-30-S-e06" class="button" id="retryBtn">
                    <span>다시 시도하기</span><i class="icon icon--arrow-16"></i>
                </button>
            </section>
        </section>

        <section class="container-floating js-floating-container">
            <!-- 메인 버튼영역 -->
            <article id="successBtn" class="main_btn-box" style="display: none">
                <div class="multi-view">
                    <a data-element-id="HIT-ORDR-22-30-S-e07" href="#none" class="button button-xl button--lv1">
                        <span class="more">주문내역 보기</span>
                    </a>
                </div>
            </article>

            <article id="failBtn" class="main_btn-box" style="display: none">
                <div class="multi-view">
                    <a data-element-id="HIT-ORDR-22-30-S-e08" href="#none" class="button button-xl button--lv1">
                        <span class="more">확인</span>
                    </a>
                </div>
            </article>
        </section>

    </main>
</div>
</body>
</html>
