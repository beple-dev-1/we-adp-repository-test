.icon--table-row-move:active {cursor:grabbing;}
.icon--table-row-move span {display:block; width:100%; height:2px; background-color:#D9D9D9;}
.sortableTable thead th {border-bottom-style:solid;}
.sortableTable tbody tr.is-dragging {opacity:0.4;}
