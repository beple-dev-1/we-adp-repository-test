<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>스마트오더 매장 메뉴</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-ORDR-28-10-S">
<div class="wrap js-wrap">
    <!-- 헤더 영역 -->
    <header class="header position-sticky">
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="HIT-ORDR-28-10-S-e07" href="#none"class="hd-btn back" id="backBtn"><span class="blind-i">뒤로가기</span></a>
        </nav>
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title" id="afltNm"></h1> <!--가맹점 명 -->
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 날짜선택 -->
        <div class="date_box mgt8 js-swipe-box">
            <ul id="dateHtml"><!-- sample:begin --><li class="late today select"><a href="#none" id="2026.09.02" onclick="uf_moveDay($(this))"><span class=""></span><strong></strong></a></li><!-- sample:end --></ul>
        </div>
        <!-- 탭박스 -->
        <div class="tab-box border-t10" id="tabBox">
            <div class="tab-wrap js-tab-button">
                <button data-element-id="HIT-ORDR-28-10-S-e05" type="button" class="tab-btn on"><span id="tab1">조식</span></button>
                <button data-element-id="HIT-ORDR-28-10-S-e06" type="button" class="tab-btn"><span id="tab2">중식</span></button>
            </div>
        </div>
        <!-- 컨테이너 -->
        <section class="smart_oder-container js-tab-area">
            <div class="js-tab-content" id="brunchTab">
                <!-- 타이틀박스 -->
                <div class="reservation-info">
                    <div class="info-inner">
                        <div class="info-header" id="brunchInfoHeader"><!-- sample:begin -->안내<!-- sample:end --></div>
                        <div class="info-content">
                            <ul class="list-bar" id="brunchListBar">
                                <li class="info-text" id="openTm">이용가능시간 <span class="startTm"></span>~<span class="endTm"></span></li>
                            </ul>
                            <ul class="list-bar" id="brunchReserveTm" style="display:none;">
                            </ul>
                        </div>

                    <!--<p class="container-text type2" id="openTm">이용가능시간 <span id="startTm"></span>~<span id="endTm"></span></p>
                    <p class="container-text type2" id="reserveTm" style="display: none"></p>-->
                    </div>
                </div>
                <!-- 컨테이너 컨텐츠 -->
                <article class="item-wrap no-border menu-view" id="brunch"><!-- sample:begin -->표본<!-- sample:end --></article>
            </div>
            <div class="js-tab-content" id="lunchTab">
                <!-- 타이틀박스 -->
                <div class="reservation-info">
                    <div class="info-inner">
                        <div class="info-header" id="lunchInfoHeader"><!-- sample:begin -->안내<!-- sample:end --></div>
                        <div class="info-content">
                            <ul class="list-bar" id="lunchListBar" style="display:none;">
                                <li class="info-text" id="openTm">이용가능시간 <span class="startTm"></span>~<span class="endTm"></span></li>
                            </ul>
                            <ul class="list-bar" id="lunchReserveTm"><!-- sample:begin --><li class="info-text">[라이브그릴  메뉴 예약]</li><li class="info-text">주문 가능 시간 전일 19:00 ~ 당일 09:00</li><li class="info-text">1부 11:30 / 2부  12:15, 원하는 운영시간 사전예약 부탁드립니다.</li><li class="info-text"></li><li class="info-text">[한식/일식 다이닝, 이탈리안 메뉴 예약]</li><li class="info-text">주문 가능 시간 전일 19:00 ~ 당일 09:00</li><li class="info-text">11:30부터 예약화면 확인 후  각 코너에서 수령 가능합니다.</li><!-- sample:end --></ul>
                        </div>

                        <!--<p class="container-text type2" id="openTm">이용가능시간 <span id="startTm"></span>~<span id="endTm"></span></p>
                        <p class="container-text type2" id="reserveTm" style="display: none"></p>-->
                    </div>
                </div>

                <!-- 컨테이너 컨텐츠 -->
                <article class="item-wrap no-border menu-view" id="lunch"><!-- sample:begin -->표본<!-- sample:end --></article>
            </div>

        </section>

        <!-- 플로팅 박스 -->
        <section class="floating-container bottom js-floating-wrap" style="display:none;" id="close">
            <!-- 메인 버튼영역 -->
            <article class="main_btn-box bg-white">
                <div class="btn-main">
                    <a data-element-id="HIT-ORDR-28-10-S-e08" id="close_btn" href="#none" class="btn-default radius-mid btn-style-h48">지금은 주문가능 시간이 아닙니다.</a><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
