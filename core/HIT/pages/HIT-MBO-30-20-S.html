<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>엔터프라이즈 가맹점pc_매니저 로그인</title>
  <link rel="stylesheet" href="../assets/ent_afltbo_resource/css/bp_admin_pc.css">
  <link rel="stylesheet" href="../assets/ent_afltbo_resource/css/datepicker.min.css">
  <link rel="stylesheet" href="../assets/ent_afltbo_resource/css/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/ent_afltbo_resource/css/slick.css">
  <link rel="stylesheet" href="../assets/js/lib/summernote/summernote-lite.min.css">
</head>
<body data-screen-id="HIT-MBO-30-20-S">
<div class="bm-root">
    <div class="bm-header">
        <div class="inner">
            <div class="left">
                <a data-element-id="HIT-MBO-30-20-S-e06" data-nav-target="HIT-MBO-30-10-S" class="logo" href="/ent_afltbo_login.act">
                    <img src="../assets/ent_afltbo_resource/img/logo/bzp_ci_resize.png" alt="BePle">
                    <span>가맹점 관리</span>
                </a>
            </div>
        </div>
    </div>
    <div class="bm-con">
        <div class="form-box">

            <p class="tit-01 with-desc ta-center mb32 mt64">
                매니저 로그인
                <span class="fs-16 mt12">등록된 매니저만 로그인 하실 수 있습니다.</span>
            </p>

            <div class="form-bm">
                <div class="form-item">
                    <span class="form-label">휴대폰 번호</span>
                    <div class="td-item-group">
                        <input data-element-id="HIT-MBO-30-20-S-e09" name="" id="phone_num" class="ip-txt type-bm w100p td-item" maxlength="11" type="tel" value="" placeholder="-없이 휴대폰 번호를 입력해 주세요."><!-- 인증번호 요청 시 readonly 추가 -->
                        <button data-element-id="HIT-MBO-30-20-S-e07" class="btn-bm btn-bm-sky w220 td-item" id="cert_req" type="button">인증번호 요청</button>
                    </div>

                </div>
                <div class="form-item">
                    <span class="form-label">인증번호</span>
                    <div class="type-bm-wrap">
                        <input data-element-id="HIT-MBO-30-20-S-e10" maxlength="6" name="" id="cert_num" class="ip-txt type-bm w100p" type="text" value="" placeholder="인증번호를 입력해 주세요">
                        <span id="timer" class="ip-timer">03:00</span><!-- 타이머 시작 시 on 클래스 추가 -->
                    </div>
                </div>
                <ul class="list list-sm mt13">
                    <li>인증번호가 도착하지 않을 경우 <span  class="fs-12 fc-pri">인증번호 재요청</span>을 눌러주세요.</li>
                    <li>인증번호는 비플페이 앱 푸시(PUSH)로 발송됩니다.</li>
                </ul>
            </div>

            <button data-element-id="HIT-MBO-30-20-S-e08" disabled id="login" class="btn-bm" type="button">로그인 하기</button>

        </div>
    </div>
</div>
</body>
</html>
