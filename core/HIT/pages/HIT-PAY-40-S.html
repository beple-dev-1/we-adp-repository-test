    /* custom daterangepicker */
    .sh_date input {
        background-color: transparent !important;

    .daterangepicker th.month, .daterangepicker .calendar-table th {
        font-weight: bold;
        color: black;
    }
    .daterangepicker td.in-range:not(.active),
    .daterangepicker td.in-range:not(.active):hover {
        background-color: #e7f2f7;
    }
    .daterangepicker td.in-range.end-date {
        color: #fff;
        background-color: #357ebd;
    }
    .drp-calendar.right {
        position: absolute;
        top: 8px;
        left: calc(100% - 50px);
    }
    .drp-calendar.right .calendar-table {
        background-color: transparent;
    }
    .drp-calendar.right tbody {
        display: none;
    }
    .drp-calendar.right thead tr:nth-child(1) th:nth-child(1),
    .drp-calendar.right thead tr:nth-child(1) th:nth-child(2)
    {
        display: none;
    }
    .drp-calendar.right thead tr:nth-child(2) {
        display: none;
    }
    .daterangepicker:nth-of-type(3) {
        right: 25px !important;
    }
    .daterangepicker:nth-of-type(3).drop-up:before {
        left: unset;
        right: 9px;
    }
    .daterangepicker:nth-of-type(3).drop-up:after {
        left: unset;
        right: 10px;
    }
</style>
