<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>메인 팝업</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">

<body data-screen-id="HIT-COMN-20-30-S">
<!-- 지원버전 상향 안내 팝업 -->
<div class="main_noti-container" id="area"><!-- 운영체제 안드로이드 일 시 aos_only 클래스 추가 -->
	<!-- 지원버전 상향안내 -->
	<div class="inner"><!-- 화면 내 스크롤 바 생성시 scroll 클래스 추가 -->
		<h1>
			H-eat+<br>
			서비스 점검 안내
		</h1>
		<p class="msg">
			<strong>금일(25)일 24:00 부터 익일(26일) 02:00까지</strong><br>
			서비스 안정화를 위한 점검이 진행됩니다.<br>
			점검 시간 동안에는 앱 사용이 중단될 예정이오니 메뉴예약(딜리버리 및 픽업 등)은 점검시간 전/후로 진행해 주세요.
		</p>
		<!-- 서비스관련 안내 -->
		<div class="info_w">
			<dl>
				<dt>일시</dt>
				<dd>
					<p>2025-02-26(수) 00:00 ~ 02:00</p>
				</dd>
			</dl>
			<dl>
				<dt>내용</dt>
				<dd>
					<p>전체 서비스 이용불가</p>
				</dd>
			</dl>
			<dl>
				<dt>사유</dt>
				<dd>
					<p>
						서비스 점검
					</p>
				</dd>
			</dl>
		</div>
		<p class="msg_2">* 자세한 내용은 공지사항을 확인해주세요.</p>
	</div>
	<div class="btn_w">
		<a data-element-id="HIT-COMN-20-30-S-e03" href="#none" id="no_more_btn">다시 보지 않기</a>
		<a data-element-id="HIT-COMN-20-30-S-e04" href="#none" id="close_btn">닫기</a>
	</div>
</div>
