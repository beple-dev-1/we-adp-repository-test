<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>메모</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-SNCK-20-S">
<div class="wrap js-wrap" >
    <!-- 헤더 영역 -->
    <header class="header position-sticky">
        <!-- 헤더 네비 -->
        <nav class="header-nav">
           <a data-element-id="HIT-SNCK-20-S-e05" class="hd-btn back" id='btnBack'><span class="blind-i">뒤로가기</span></a>
         </nav>
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title">메모</h1>
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 메모 리스트 영역 -->
        <section class="memo-container">
            <article class="memo__item-wrap" id='memoList'><!-- sample:begin --><div class="memo-item "><div class="item-hd"><p class="memo-name"><strong>홍길동</strong></p><p class="memo-date">2026.09.02 14:22</p></div><div class="item-con"></div></div><!-- sample:end --></article>
             <!-- 입력된 메모 없을 시 -->
            <article class="memo__item-wrap" id='noMemoList' style="display: none">
                <div class="item-none">
                    <p class="icon content_none-58">
                        <span class="blind-i">메모없음</span>
                    </p>
                    <p class="item-none-text">작성된 메모가 없습니다.</p>
                </div>
            </article>
        </section>
        <!--  메모 입력 영역 -->
        <section class="memo_input-container">
            <!-- 입력 form box - 예시 -->
            <div class="form-box">
                <!-- 박스 컨텐츠 -->
                <div class="form__item-wrap">
                    <div class="form-item form-textarea js-autoresize">
                        <textarea data-element-id="HIT-SNCK-20-S-e06"  onkeyup="checkCount();" name="ctnt" id="ctnt" placeholder="메모를 남겨주세요(최대 1,000글자)"></textarea>
                    </div>
                    <!-- 메모 전송 버튼 -->
                    <div class="send_btn-box">
                        <button data-element-id="HIT-SNCK-20-S-e04" type="button" class="send-btn icon send-24" id='sendBtn' onclick="sendMessage()"><!-- 입력 시 on 클래스 추가 / 내용 없을 시 on 클래스 제거 -->
                            <span class="blind-i">메모 전송</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    </div>
</body>
</html>
