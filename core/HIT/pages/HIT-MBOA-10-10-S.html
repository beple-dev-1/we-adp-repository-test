<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>엔터프라이즈 가맹점pc_가맹점주 로그인(앱 버전)</title>
  <link rel="stylesheet" href="../assets/ent_aflt_resource/css/heat_admin-mobile.css">
</head>
<body data-screen-id="HIT-MBOA-10-10-S">
<div class="app app--login">
    <header class="ds-appbar">
      <span class="ds-appbar__action"></span>
      <span class="ds-appbar__title"></span>
      <span class="ds-appbar__action"></span>
    </header>
    <div class="login-body">
      <h2 class="login-section-title"><!-- copy: login.owner.title -->가맹점주 로그인</h2>
      <div class="ds-text-field">
        <label class="ds-text-field__label"><!-- copy: login.owner.id -->아이디</label>
        <div class="ds-text-field__control"><input data-element-id="HIT-MBOA-10-10-S-e07" id="user_id" class="ds-text-field__input" type="text" placeholder="아이디 입력" /></div>
      </div>
      <div class="ds-text-field">
        <label class="ds-text-field__label"><!-- copy: login.owner.pw -->비밀번호</label>
        <div class="ds-text-field__control"><input data-element-id="HIT-MBOA-10-10-S-e08" id="user_pw" class="ds-text-field__input" type="password" placeholder="비밀번호 입력" /></div>
      </div>
      <div class="login-owner-actions">
        <button data-element-id="HIT-MBOA-10-10-S-e05" id="sign_in" class="ds-button ds-button--primary ds-button--block ds-button--xlarge ds-button--disabled"><!-- copy: login.owner.btn -->로그인</button>
        <hr class="ds-divider" />
        <button data-element-id="HIT-MBOA-10-10-S-e06" id="manager_sign_in" class="ds-button ds-button--outline ds-button--block ds-button--xlarge"><!-- copy: login.owner.manager -->매니저 로그인</button>
      </div>
    </div>
  </div>
<!--   -->
</body>
</html>
