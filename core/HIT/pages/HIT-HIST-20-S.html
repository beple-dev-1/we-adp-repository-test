<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>스마트오더 주문 상세내역 안내</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_beple.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_beple_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/beple_popup.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
</head>
<body data-screen-id="HIT-HIST-20-S">
<div class="wrap js-wrap">
    <header class="header position-sticky js-heder">
        <nav class="header__navi">
            <a data-element-id="HIT-HIST-20-S-e07" href="#none" class="header__btn btn-back"><span class="blind">이전 페이지로</span></a>
        </nav>

        <!-- 헤더 타이틀 -->
        <div class="header__title-wrap">
            <!-- 페이지 명 미사용 시 page-name 태그 내용 빈값 or 주석 or 삭제 -->
            <h1 class="page-name"><span>도움이 필요하신가요?</span></h1>
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <section class="flex-column grow-y pdt24 gap-32">
            <div class="container-header justify-spacing-def shrink-n col--block">
                <h2 class="container__headline container__headline--lv4">문의하실 내용을 선택해 주세요</h2>
            </div>

            <div class="flex-row grow-y shrink-n justify-spacing-def">
                <div class="help-desk">
                    <a data-element-id="HIT-HIST-20-S-e08" href="#none" class="button button-xl button--lv5" onclick="deliveryStatus()">
                        <span>배달 현황 문의</span>
                    </a>
                    <a data-element-id="HIT-HIST-20-S-e09" href="#none" class="button button-xl button--lv5" onclick="addressChange()">
                        <span>배달 주소 변경</span>
                    </a>
                    <a data-element-id="HIT-HIST-20-S-e10" href="#none" class="button button-xl button--lv5" onclick="menuChange()">
                        <span>메뉴/수량 변경</span>
                    </a>
                    <a data-element-id="HIT-HIST-20-S-e11" href="#none" class="button button-xl button--lv5" onclick="robotComplain()">
                        <span>로봇배송 불편사항 접수</span>
                    </a>
                    <a data-element-id="HIT-HIST-20-S-e12" href="#none" class="button button-xl button--lv5" onclick="etcComplain()">
                        <span>기타 문의</span>
                    </a>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
