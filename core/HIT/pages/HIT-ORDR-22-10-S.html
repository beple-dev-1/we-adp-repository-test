<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>스마트오더 주문</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-ORDR-22-10-S">
<div class="wrap js-wrap bg-f7">
    <!-- 헤더 영역 -->
    <header class="header position-sticky">
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="HIT-ORDR-22-10-S-e08" href="#none"class="hd-btn back" id="backBtn"><span class="blind-i">뒤로가기</span></a>
        </nav>
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title" id="title">예약하기</h1>
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <!-- 컨테이너 -->
        <section class="smart_oder-container">
            <div class="container-hd type2 flex-column pdt16">
                <h2 class="container-text title sub" id='placeName'>배송지</h2>
                <p class="container-text" id="deliveryAddr"><!-- sample:begin -->서울 강남구 테헤란로 1길 10<!-- sample:end --></p>
                <p class="btn-wrap position-abs" id='reservationAddrChangeBtn'>
                    <a data-element-id="HIT-ORDR-22-10-S-e09" href="#none" class="btn btn-line-light" id="addrChange">변경</a>
                </p>
            </div>
            <!-- // 딜리버리 -->
            <!--
                **********************************************************************************

                비플페이 APP 기준 푸딩(오피스 푸드) 장바구니 화면의 구조를 가져와서 적용하였습니다.
                작업에 참고 부탁드립니다.

                **********************************************************************************
            -->
            <!-- 컨테이너 컨텐츠 -->
            <article class="oder_cart">
                <!-- 주문목록 -->
                <div class="cart_w"><!-- 장바구니 일 경우(상단 날짜영역 없을 시) - border-t10 클래스 추가 -->
                    <!-- 주문날짜 -->
                    <div class="cart_date">
                        <p id="prvdDt"><!-- sample:begin -->2026.09.02<!-- sample:end --></p>
                    </div>
                    <!-- 목록 -->
                    <div class="list">
                        <!-- 원본기준 변경사항 list-hd div 및 박스 내 list-text 추가 -->
                        <div class="list-hd">
                            <h3 class="name" id="afltNm"></h3>
                            <p class="list-text" id="reprMenuNm"><!-- sample:begin -->홍길동<!-- sample:end --></p>
                        </div>
                        <!-- // 원본기준 변경사항 -> list-hd div 추가 및 박스 내 list-text 추가 -->
                        <div class="detail">
                            <ul class="list-bar"><!-- 원본기준 변경사항 -> list_bar > list-bar 변경 -->
                                <li id="prvdTp"><!-- sample:begin -->표본<!-- sample:end --></li>
                                <li id="left"><!-- sample:begin -->표본<!-- sample:end --></li>
                            </ul>
                        </div>
                        <p class="price"><span id="amt"><!-- sample:begin -->4,500<!-- sample:end --></span>원</p>
                    </div>
                </div>
                <!-- 안내사항 -->
                <div class="noti_txt">
                    비플페이(주)는 통신판매중개자이며, 통신판매의 당사자가 아닙니다. 따라서 비플페이(주)는 상품, 거래정보 및 거래에 대하여 책임을 지지 않습니다.
                </div>
            </article>
        </section>

        <!-- 플로팅 박스 -->
        <section class="floating-container bottom js-floating-wrap">
            <!-- 메인 버튼영역 -->
            <article class="main_btn-box bg-f7">
                <div class="btn-main">
                    <a data-element-id="HIT-ORDR-22-10-S-e10" href="#none" id="payBtn" class="btn-default radius-mid btn-style-h48 on"><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                        결제하기
                    </a>
                </div>
            </article>
        </section>
        
        
        <!-- 레이어팝업 -->
         
           <section class="popup-container overlay" name="popBox" id="delvListBox" style="display:none;">
                <div class="popup-box bottom">
                    <div class="inner-box" id="step1">
                        <!-- 컨테이너 헤더 -->
                        <div class="box-hd pd-lr20 pdt24">
                            <p class="box__hd-text" >배달주소</p>
                        </div>
                        <!-- 컨테이너 컨텐츠 --> 
                        <article class="box-content pd-lr20 mgt16 max_height-200 scroll-y" id="delvList"><!-- sample:begin -->표본<!-- sample:end --></article>
                        <!-- 메인버튼 - 팝업용 -->
                        <div class="main_btn-box pd-lr10 pdb10 mgt20">
                            <div class="btn-main">
                                <button data-element-id="HIT-ORDR-22-10-S-e06" id="delv_btn1" type="button" class="btn-default radius-mid btn-style-h48">저장</button>
                            </div>
                        </div>
                        <!-- 닫기버튼 -->
                        <p id="delvListBox_exit" class="close_btn-box"><button data-element-id="HIT-ORDR-22-10-S-e07" type="button" class="close-btn icon close-14"><span class="blind-i">팝업닫기</span></button></p>
                    </div>
                    
                    <div class="inner-box" id="step2" style="display:none !important;">
                        <!-- 컨테이너 헤더 -->
                        <div class="box-hd pd-lr20 pdt24">
                            <p class="box__hd-text">상세 주소</p>
                        </div>
                        <!-- 컨테이너 컨텐츠 -->
                        <article class="box-content pd-lr20 mgt16 max_height-200 scroll-y" id="delvDetailList"><!-- sample:begin -->표본<!-- sample:end --></article>
                        <!-- 메인버튼 - 팝업용 -->
                        <div class="main_btn-box pd-lr10 pdb10 mgt20">
                            <div class="btn-main">
                                <button id="delv_btn2" type="button" class="btn-default radius-mid btn-style-h48">저장</button>
                            </div>
                        </div>
                        <!-- 닫기버튼 -->
                        <p id="delvDetailListBox_exit" class="close_btn-box"><button type="button" class="close-btn icon close-14"><span class="blind-i">팝업닫기</span></button></p>
                    </div>
                </div>
            </section>
        
    </main>
</div>
</body>
</html>
