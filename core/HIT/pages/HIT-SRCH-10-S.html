<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>가맹점 찾기 리뷰작성</title>
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_header.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_style.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/ent_reset.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/ent_resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/ent_resource/css/swiper.min.css">
</head>
<body data-screen-id="HIT-SRCH-10-S">
<form name="frm" id="frm">
    <input id="AFLT_ID" name="AFLT_ID" type="hidden" value="">
    <input id="MODIFY_YN" name=MODIFY_YN" type="hidden" value="">
</form>
<div class="wrap js-wrap">
    <!-- 헤더 영역 -->
    <header class="header position-sticky">
        <!-- 헤더 네비 -->
        <nav class="header-nav">
            <a data-element-id="HIT-SRCH-10-S-e04" data-nav-target="HIT-SRCH-10-10-S" href="#none" class="hd-btn back" onclick="uf_back();"><span class="blind-i">뒤로가기</span></a>
        </nav>
        <!-- 헤더 타이틀 -->
        <div class="page-title">
            <h1 class="header-title">가맹점 리뷰</h1>
        </div>
    </header>

    <!-- 컨텐츠 영역 -->
    <main class="container-wrap js-container-wrap">
        <section class="review-container">
            <!-- 컨테이너 컨텐츠 -->
            <article class="review-wrap write-wrap">
                <div class="form-box">
                    <div class="box-hd flex-row justify-space">
                        <p class="form-label">리뷰를 작성해 주세요.</p>
                        <p class="form-txt-count"><strong id="real_cnt">0</strong><span>/100</span></p>
                    </div>
                    <div class="form-item form-textarea hint">
                        <textarea data-element-id="HIT-SRCH-10-S-e06" name="" id="review" placeholder="작성된 내용은 가맹점 상세에 노출되며, 다른 사용자들이 볼 수 있습니다. 긍정적인 표현을 사용하여 모두에게 유익한 정보를 작성해 주세요!"  onkeyup="review_text()" maxlength="100"></textarea>
                        <!-- 힌트 txt -->
                        <p class="hint-txt"></p>
                    </div>
                </div>
            </article>
        </section>

        <!-- 플로팅 박스 -->
        <section class="floating-container bottom js-floating-wrap">
            <!-- 메인 버튼영역 -->
            <article class="main_btn-box bg-white">
                <div class="btn-main">
                    <a data-element-id="HIT-SRCH-10-S-e05" href="#none" class="btn-default radius-mid btn-style-h48" id="btn_save" onclick="btn_save();">저장</a><!-- 비활성 시 on 클래스 제거 / 활성 시 on 클래스 추가 -->
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
