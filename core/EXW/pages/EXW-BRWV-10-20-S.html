<body data-screen-id="EXW-BRWV-10-20-S">
<form id="frm" name="frm">
	<input type="hidden" name="BGC_ID" id="BGC_ID"/>
	<input type="hidden" name="PUB_TYPE" id="PUB_TYPE"/>
	<input type="hidden" name="KIND_CODE" id="KIND_CODE"/>
	<input type="hidden" name="TOKEN" id="TOKEN" value="">
	
	<input type="hidden" name="REF_URL" id="REF_URL" value="">
	<input type="hidden" name="KEYWORD" id="KEYWORD" value="">
	<input type="hidden" name="CATE_BGC_ID" id="CATE_BGC_ID" value="">
	
	<input type="hidden" name="REF_GIFT_TYPE" id="REF_GIFT_TYPE" value="">
	<input type="hidden" name="REF_MIN_AMT" id="REF_MIN_AMT" value="">
	<input type="hidden" name="REF_MAX_AMT" id="REF_MAX_AMT" value="">
	<input type="hidden" name="REF_SORTING" id="REF_SORTING" value="">
	
	
</form>
<form id="saas_frm" name="saas_frm">
	<input type="hidden" name="NATIVE_RESULT" id="NATIVE_RESULT"/>
	<input type="hidden" name="ZPPP_WEBVIEW_URL" id="ZPPP_WEBVIEW_URL"/>

</form>
	<!-- wrap -->
	<div class="wrap">
		
		
		<div class="container">
			<!-- content -->
			<div id ="content" class="content" style="display:none;" >
				<div class="br_gift_rn">
					<!-- 상품권 리스트 -->
					<div class="gift_list">
						<!-- 검색영역 -->
						<div class="search_bx on"><!-- 검색영역 활성화 시 "on" 추가/제거 -->
							<div class="ipt_bx">
								<span class="scarch_icon">검색</span>
								<input id="search_keyword" type="text" value="" placeholder="브랜드 또는 키워드를 검색해 보세요.">
								<a id="del_input_keyword" class="del" style="display:none;"><span class="blind">내용삭제</span></a><!-- 내용 입력 시 활성화 -->
							</div>
							
							
							<div id="SrchHistList" class="keyword recent"><!-- 최근검색어 의 경우 "recent" 클래스 추가 -->
								<p class="tit">최근 검색어</p>
								<p class="del_all"><a id="del_recent_all">전체 삭제</a></p><!-- 최근 검색어 전체삭제 -->
								<div class="list" id="recent_keyword_list">
									<ul>
										
										<li id="gift_list">
											<a id="recent_li" onclick="uf_callSearch('');"></a>
											<a class="key_del" value=""><span class="blind">삭제</span></a>
										</li>
										
									</ul>
								</div>
							</div>
							
							<div id="SrchHistList" class="keyword recent" style ="display:none;">
								<p class="tit">최근 검색어</p>
								<p class="del_all"><a id="del_recent_all">전체 삭제</a></p>
								<div class="list" id="recent_keyword_list"></div>
							</div>
							
							
							<div id="reclist" class="keyword"><!-- 최근검색어 의 경우 "recent" 클래스 추가 -->
								<p class="tit">추천 키워드</p>
								<div class="list" id="keyword_list">
									<ul>
									
										<li><a id="keyword_li" value="" onclick="uf_callSearch('');" ></a></li>
									
									</ul>
								</div>
							</div>
							
						</div>
						<!-- //검색영역 끝 -->
						
						<!-- 필터 -->
						<div id="brand_filter" class="brand_filter" style="display:none;">
							<!-- 
							<ul>
								<li class="on"><a href="#none">전체</a></li> // 브랜드 선택 시 on 클래스 추가
							</ul>
							 -->
						</div>
						<!-- 상품권 목록 -->
						<!-- 필터 -->
						<div id="kindList_filter" class="filter" style="display:none;">
							<p class="sort"><a id="sort_type" data-type="0" >혜택순</a></p>
							<p class="sch_filter"><a id="open_pop">필터</a></p>
						</div>
						<!-- 상품권 목록 -->
						
						<div id="kindList" class="list_area addBtn-pb56" style="display:none;"><!-- sample:begin -->표본<!-- sample:end --></div>
					</div>
					<!-- //상품권 리스트 -->
				</div>
				
				<!-- 하단 네비게이션 -->
				<div class="btn_botFix_w">
				<!-- <nav class="nav_w bg_white">
						<div class="home on"><!-- 선택 시 on -->
							<!-- <a href="/brnd_webview_main.act"> -->
							<a href="/brnd_webview_main.act?TOKEN=" >
								<span>홈</span>
							</a>
						</div>
						<div class="history" id="history">
						<a href="/brnd_webview_gift_hist_main.act?TOKEN=">
							<span>내역</span>
						</a>
						</div>
						<div class="prev on">
							<a href="javascript:window.history.back();">
								<span>이전</span>
							</a>
						</div>
						<div class="next on">
							<a href="javascript:window.history.forward();">
								<span>다음</span>
							</a>
						</div>
					</nav> -->
					<nav class="nav_w bg_white">
						<div class="home on" id="home"><!-- 선택 시 on -->
							<a href="#none" onclick="uf_move('home');">
								<span>홈</span>
							</a>
						</div>
						<div class="history on" id="history">
						<a href="#none" onclick="uf_move('history');">
								<span>내역</span>
							</a>
						</div>
						<div class="prev on" id="prev">
							<a href="#none" onclick="uf_move('prev');">
								<span>이전</span>
							</a>
						</div>
						<div class="next on" id="next">
							<a href="#none" onclick="uf_move('next');">
								<span>다음</span>
							</a>
						</div>
					</nav>
				</div>
				<!-- //하단 네비게이션 -->
				
			</div>
			<!-- // content -->
		</div>
		<!-- // container -->
	</div>
	<!-- // wrap -->
	

<!-- 레이어팝업 -->
<div id="sort_layer" class="layer_overlay" style="display:none;">
	<div class="layer_bPop sort_layer">
		<div class="popup_con pd0">
			<!-- 정렬 필터 -->
			<div class="br_n_sort">
				<h2>정렬</h2>
				<!-- 닫기버튼 -->
				<p class="btn_close">
					<a id="btn_close"><span class="blind">닫기</span></a>
				</p>
				<!-- //닫기버튼 -->
				<!-- 필터 목록 -->
				<ul class="list" id="sort_list" >
					<li class="chk"><a id="0">혜택순</a></li><!-- 현재 선택된 항목 chk 클래스 추가 -->
					<li><a id="1">판매량순</a></li>
					<li><a id="2">신상품순</a></li>
					
				</ul>
				<!-- //필터 목록 -->
			</div>
			<!-- //정렬 필터 -->
		</div>
	</div>
</div>
<!-- //레이어팝업 -->
	
<!-- 레이어팝업 - 기간 및 상세필터 -->
<div id="layer_overlay" class="layer_overlay" style="display:none;">
	<div class="layer_bPop detail" style="display:;">
		<div class="popup_con pd0">
			<!-- 상세필터 -->
			<div class="detail_filter addBtn-pb58">
				<!-- 기간 -->
				<h2 class="filter_tit">상품권 종류</h2>
				<!-- 탭영역 -->
				<div id="gift_type" class="filter_tab">
					<div class="inner four">
						<a id="gift_type_all" class="on" title="선택됨">전체</a>
						<a id="01">금액권</a>
						<a id="02">교환권</a>
						<a class="empty">&nbsp;</a><!-- 컨텐츠 사이즈 맞춤용 여백 -->
					</div>
				</div>
				<!-- 상품권 종류 -->
				<h2 class="filter_tit">금액</h2>
				<!-- 탭영역 -->
				<div id="gift_money" class="filter_tab">
					<div class="inner four">
						<a id="gift_money_all" min_amt=""  max_amt="" class="on" title="선택됨">전체</a>
						<a id="gift_money_1000" min_amt="0" max_amt="9999">1만원 미만</a>
						<a id="gift_money_1020" min_amt="10000" max_amt="29999">1-2만원대</a>
						<a id="gift_money_3040" min_amt="30000" max_amt="49999">3-4만원대</a>
					</div>
					<div class="inner four mgt10">
						<a id="gift_money_5000" min_amt="50000">5만원 이상</a>
						<a href="#none" class="empty">&nbsp;</a><!-- 컨텐츠 사이즈 맞춤용 여백 -->
						<a href="#none" class="empty">&nbsp;</a><!-- 컨텐츠 사이즈 맞춤용 여백 -->
						<a href="#none" class="empty">&nbsp;</a><!-- 컨텐츠 사이즈 맞춤용 여백 -->
					</div>
				</div>
			</div>
			<!-- //상세필터 -->
			<!-- 하단 고정버튼 -->
			<div class="btn_botFix_w">
				<div class="inner bg_white">
					<a id="pop_search" class="btn_default round_r8 btn-style-h48 on">조회하기</a>
				</div>
			</div>
			<!-- //하단 고정버튼 -->
		</div>
	</div>
</div>
<!-- //레이어팝업 -->
