	<div class="wrap">

		<main class="container-wrap js-container-wrap">

				<!-- 결제하기 -->
				<section class="container payment__info js-container justify-spacing-def">
					<!-- 결제 수단 안내 - [D] 미사용 시 header 영역 display: none; -->
					<header id="lmt_info_area" class="container__header">
						<div class="headline">

							 <img alt="" class="head-image">

							</p>
						</div>
					</header>

					<!-- 결제정보 -->
					<section class="container__body">
						<div class="body__content">
							<!-- 결제 매장 -->
							<h2 class="pay-store">
								<span class="store" id="aflt_nm"><!-- sample:begin -->홍길동<!-- sample:end --></span>
							</h2>
							<!-- 결제금액 -->
							<div class="pay-amount">
								<!-- 안내 메세지 - [D] 금액 입력 시 display: none; 제거 -->
								<div id="placeholder" class="placeholder">
									<p class="placeholder-text">결제금액을 입력해 주세요</p>
								</div>
								
								<!-- 금액 입력 - [D] 금액 미입력/전체 제거 시 display: none; 추가 -->
								<div id="input_amount_area" class="amount" style="display: none;">
									<p class="amount-value js-amount-value"></p>
									<p class="amount-text">원</p>
								</div>
								
								<!-- 경고메세지 - [D] 안내사항 있으 시 노출 / [D] 금액 미입력/ 전체 제거 시 display: none; 추가 -->
								<div id="auto_chrg_msg" class="noti" style="display: none;">
									<p class="noti-text">
										부족한 금액은 비플머니로 자동 충전됩니다.
									</p>
								</div>
								
								<div id="pay_over_msg" class="noti" style="display: none;">
									<p class="noti-text fc-red">										
									</p>
								</div>
							</div>
						</div>
					</section>
				</section>

				<section class="payment__myinfo container-floating js-floating-container">
					<div class="table-wrap justify-spacing-def">
						<section class="table--body table--data-lite">
							<table class="table table--data">
								<colgroup>
									<col style="width: 105px;">
									<col style="width: 207px;">
								</colgroup>
								<tbody>
									<tr>
										<th><p>보유 비플머니</p></th>
										<td><p class="fw-600" id="cur_mny"><!-- sample:begin -->표본<!-- sample:end --></p></td>
									</tr>
									<tr>
										<th><p>자동충전 계좌</p></th>
										<td>
											<p>
												<button id="mny_acct_info" type="button" class="flex-row align-center button js-popup-open" data-modal="popup-select--bank"><!-- sample:begin -->표본<!-- sample:end --></button>
											</p>
										</td>
									</tr>
								</tbody>
							</table>
						</section>
					</div>
					<!-- 비플 커스텀 키패드 박스 -->

							<button type="button" data-key="1" class="key-item"><span>1</span></button>
							<button type="button" data-key="2" class="key-item"><span>2</span></button>
							<button type="button" data-key="3" class="key-item"><span>3</span></button>

							<button type="button" data-key="6" class="key-item"><span>6</span></button>
							<button type="button" data-key="7" class="key-item"><span>7</span></button>
							<button type="button" data-key="8" class="key-item"><span>8</span></button>
							<button type="button" data-key="9" class="key-item"><span>9</span></button>
							<button type="button" data-key="00" class="key-item"><span>00</span></button>
							<button type="button" data-key="0" class="key-item"><span>0</span></button>
							<button type="button" class="key-item delete"><span class="blind">지우기</span></button>
						</div>
						<!-- 메인버튼 -->
						<div class="btn-box justify-spacing-btn">
							<a id="btn_next" class="button button-xl button--lv1 js-popup-open dis" data-modal="popup-payment--confirm"><!-- [D] 활성화 시 dis 클래스 제거 -->
								<span>다음</span>
							</a>
						</div>
					</div>

								<span>다음</span>
							</a>
						</div>
					</div> -->
