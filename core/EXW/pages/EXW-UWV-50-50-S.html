<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>거래내역 상세</title>
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/popup.css">
</head>
<body data-screen-id="EXW-UWV-50-50-S">
<!-- 복귀용 폼 — 뒤로가기가 내부 화면이면 DATA 를 DATA_BACK 으로 바꿔 전송한다 -->
<form name="frm" id="frm" method="post">
	<input type="hidden" id="ORG_ID" name="ORG_ID" value="">
	<input type="hidden" id="DATA"   name="DATA"   value="">

	<!-- 이하 화면 내부 참조용 (전송 대상 아님 — name 을 두지 않는다) -->
	<input type="hidden" id="DATA_BACK" value="">
	<input type="hidden" id="BACK_URL"  value="">
</form>

	<div class="wrap">
		<!-- 헤더 -->
		<header class="header position-sticky">
			<div class="header__title-wrap">
				<h1 class="page-name"><span>상세 내역</span></h1>
			</div>

			<nav class="header__navi">
				<a href="#none" class="header__btn btn-close" id="btnClose">
					<span class="blind">페이지 닫기</span>
				</a>
			</nav>
		</header>

		<!-- 메인 컨텐츠 -->
		<main class="container-wrap js-container-wrap">
			<!-- 컨테이너 — data-receipt--transfer 는 BM304(이체·출금 상세)용 변형이다.
			     퍼블리싱이 이 하나뿐이라 전 거래유형에 공용으로 쓴다(사용자 확정). -->
			<section class="container data-receipt data-receipt--transfer js-container">
				<!-- 컨테이너 헤더 -->
				<header class="container__header justify-spacing-def">
					<div class="container__header--content">
						<h3 class="container__headline gap-8">
							<div class="store">
								<strong class="ellipsis-line--3"></strong>
							</div>
							<!-- 금액은 부호 없이 절대값이다 — 증감 방향은 위 거래명이 드러낸다 -->
							<div class="price">
								<strong><span>4,500</span>원</strong>
							</div>
						</h3>
					</div>
				</header>

				<!-- 영수증 내역 -->
				<article class="container__body justify-spacing-def">
					<div class="body__content">
						<div class="flex-column">
							<div class="table-wrap">
								<section class="table--body">
									<table class="table table--data" aria-label="거래내역 상세">
										<colgroup>
											<col style="width: 102px;">
											<col style="width: 210px;">
										</colgroup>
										<tbody>
											<!-- 거래구분 -->
											<tr>
												<th>
													<div>거래구분</div>
												</th>
												<td>
													<div class="fc-primary fw-600"></div>
												</td>
											</tr>
											<!-- 거래일시 -->
											<tr>
												<th>
													<div>거래일시</div>
												</th>
												<td>
													<div></div>
												</td>
											</tr>
											<!-- 입금예정일시 — 출금에만 값이 있다(거래일 + 1일) -->
											<tr>
												<th>
													<div>입금예정일시</div>
												</th>
												<td>
													<div></div>
												</td>
											</tr>
											<!-- 출금계좌 — A 원장(충전·출금·소멸·지급)에만 값이 있다 -->
											<tr>
												<th>
													<div>출금계좌</div>
												</th>
												<td>
													<div></div>
												</td>
											</tr>
											<!-- 거래 후 잔액 -->
											<tr>
												<th>
													<div>거래 후 잔액</div>
												</th>
												<td>
													<div><span>4,500</span>원</div>
												</td>
											</tr>
											<!-- 내역번호 -->
											<tr>
												<th>
													<div>내역번호</div>
												</th>
												<td>
													<div></div>
												</td>
											</tr>
										</tbody>
									</table>
								</section>
							</div>
						</div>
					</div>
				</article>
			</section>
		</main>
	</div>
	<!-- // wrap -->
</body>
</html>
