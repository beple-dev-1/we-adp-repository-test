<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>구매내역 조회</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
  <link rel="stylesheet" href="../assets/resource/css/bple_order.css">
</head>
<body data-screen-id="EXW-BRWV-20-30-S">
<form id="frm" name="frm">
	<input type="hidden" name="BGC_NO" id="BGC_NO"/>
	<input type="hidden" name="TOKEN" id="TOKEN" value="">
	
	<input type="hidden" name="set_str_date_text" id="set_str_date_text" value=""/>
	<input type="hidden" name="set_end_date_text" id="set_end_date_text" value=""/>
	
	<input type="hidden" name="option_period_text" id="option_period_text" value="1개월"/>
	<input type="hidden" name="kind_period_text" id="kind_period_text"  value="전체"/>
	<input type="hidden" name="req_period_text" id="req_period_text"  value="전체"/>
</form>
	<!-- wrap -->
	<div class="wrap">
		
		<!-- container -->
		<div class="container">
			<!-- content -->
			<div class="content">
				<div class="br_gift_rn">
					<!-- 결제내역 -->
					<div class="detail_view addBtn-pb58">
						<!-- 필터 -->
						<div class="brand_filter add_arr" style="display: none"><!-- 화살표 추가 시 add_arr 클래스 추가 -->
							<ul id="option_area">
								<li class="on"><a id="option_period">1개월 <span class="arr">더보기</span></a></li><!-- 설정 시 on 클래스 추가 -->
								<li><a id="kind_period">전체 상품권 <span class="arr">더보기</span></a></li>
								<li><a id="req_period">전체 상태 <span class="arr">더보기</span></a></li>
							</ul>
						</div>

						<!-- 내역 목록 -->
						<div class="dtl_list buy" id="hist_area"><!-- sample:begin -->표본<!-- sample:end --></div>
					</div>
				</div>
				<!-- 하단 고정버튼 -->
				<div class="btn_botFix_w">
					<nav class="nav_w bg_white">
						<div class="home on"><!-- 선택 시 on -->
							<a onclick="uf_move('home');">
								<span>홈</span>
							</a>
						</div>
						<div class="history on">
							<a onclick="uf_move('list');">
								<span>내역</span>
							</a>
						</div>
						<div class="prev on">
						<!-- <a onclick="uf_move('prev');"> -->
							<a onclick="uf_move('list');">
								<span>이전</span>
							</a>
						</div>
						<div class="next on">
							<a onclick="uf_move('next');">
								<span>다음</span>
							</a>
						</div>
					</nav>
				</div>
				<!-- //하단 고정버튼 -->
			</div>
			<!-- // content -->
			
		</div>
		<!-- // container -->
	</div>
	<!-- // wrap -->
	
<!-- 레이어팝업 - 기간 및 상세필터 -->
<div class="layer_overlay" style="display:none;" id="option_layer">
	<div class="layer_bPop">
		<div class="popup_con pd0">
			<!-- 상세필터 -->
			<div class="detail_filter addBtn-pb58">
				<!-- 기간 -->
				<h2 class="filter_tit">기간</h2>
				<!-- 탭영역 -->
				<div class="filter_tab">
					<div class="inner four" id="period_list">
						<a data-period="29" class="on" title="선택됨">1개월</a>
						<a data-period="89">3개월</a>
						<a data-period="179">6개월</a>
						<a data-period="setup">기간설정</a>
						<input type="hidden" id="str_time" name="str_time">
						<input type="hidden" id="end_time" name="end_time">
					</div>
				</div>
				<!-- 날짜 -->
				<div class="filter_date disabled" style="display:block;" id="set_period"><!-- 기간설정 시 display:block; -->
					<div class="inner">
						<div class="date"><input type="text" readonly id="set_str_date" name="set_str_date"><a onclick="javascript:dateClick('str');" id="strD" style="display: none;"  class="btn_cal"><span class="blind">달력</span></a></div>
						<div class="dash">-</div>
						<div class="date"><input type="text" readonly id="set_end_date" name="set_end_date"><a onclick="javascript:dateClick('end');" id="endD" style="display: none;" class="btn_cal"><span class="blind">달력</span></a></div>
					</div>
					<!-- 오류메시지 -->
					<div id="over_data" class="err_txt" style="display:none;">조회기간은 6개월을 넘을 수 없습니다.</div><!-- 기간설정 조회기간 오류 시(3개월 넘길경우) display:block; -->
				</div>
				<!-- 상품권 종류 -->
				<h2 class="filter_tit">상품권 종류</h2>
				<!-- 탭영역 -->
				<div class="filter_tab">
					<div class="inner" id="kind_type_list">
						<a data-type="" class="on" title="선택됨">전체</a>
						<a data-type="01">금액권</a>
						<a data-type="02">교환권</a>
						<input type="hidden" id="kind_type" name="kind_type" value="">
					</div>
				</div>
				<!-- 결제 상태 영역 -->
				<h2 class="filter_tit">내역 상태</h2>
				<!-- 탭영역 -->
				<div class="filter_tab" id="req_list">
					<div class="inner">
						<a data-type="" class="on" title="선택됨">전체</a>
						<a data-type="U">사용가능</a>
						<a data-type="F">사용완료</a>
					</div>
					<div class="inner mgt10">
						<a data-type="G"  style="display:none;">선물</a>
						<a data-type="E">만료</a>
						<a data-type="C">환불</a>
					</div>
					<input type="hidden" id="req_type" name="req_type" value="">
				</div>
			</div>
			<!-- //상세필터 -->
			<!-- 하단 고정버튼 -->
			<div class="btn_botFix_w">
				<div class="inner bg_white">
					<a id="search_btn" class="btn_default round_r8 btn-style-h48 on">조회하기</a>
				</div>
			</div>
			<!-- //하단 고정버튼 -->
		</div>
	</div>
</div>
<!-- //레이어팝업 -->
</body>
</html>
