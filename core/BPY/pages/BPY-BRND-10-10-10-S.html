<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>인증 계좌 선택</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPY-BRND-10-10-10-S">
<form id="frm">
	<input type="hidden" name="BANK_CD" id="BANK_CD"/>
	<input type="hidden" name="ACCT_NO" id="ACCT_NO"/>
</form>
<div class="wrap" com-step-id="step1">
	<div class="header floating-back-header floating-sticky">
		<a data-element-id="BPY-BRND-10-10-10-S-e03" class="btn-history-back type2" id="step1_btn_back">상위메뉴로 이동</a>
		<h1>계좌인증</h1>
	</div>

	<div class="container">
		<div class="content">
			<!-- 등록 계좌 있음 -->
			<div class="account_select cert_fishing addBtn-pb58">
				<div class="cert-hd">
					<p class="hd-text tit">계좌를 선택해주세요.</p>
					<p class="hd-text fc-info">비플페이에 등록된 계좌 중 1원 인증을 진행할 계좌를 선택해 주세요.</p>
				</div>
				<!-- 계좌 목록 -->
				<ul class="acc_list mgt24" id="acctList">
					
					<li>
						<div class="inner style-type2 main">
							<p class="ico">
								<img src="../assets/image/bank/ico_account_kb.png" alt="국민은행">
							</p>
							<div class="con_w">
								<p class="name" id="bank_info" bankCd="" acctNo="">국민은행()</p>
								<p class="fcRed">계좌를 삭제 후 재등록해주세요</p>
							</div>
						</div>
					</li>
					
				</ul>
			</div>
			<!-- 계좌 추가/등록 버튼 -->
			<div class="btn_botFix_w">
				<div class="inner">
					<a data-element-id="BPY-BRND-10-10-10-S-e04" id="btn_auth" class="btn_default btn-style-h48 round_r8">
						<span>내 계좌로 1원 보내기</span>
					</a>
				</div>
			</div>
		</div>
	</div><!-- // container -->
</div><!-- // wrap -->

<!-- // container -->
</div><!-- // wrap -->

<!-- // wrap -->
</body>
</html>
