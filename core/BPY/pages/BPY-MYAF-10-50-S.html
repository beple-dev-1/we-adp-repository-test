<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>가맹점프로필 > 가맹점 프로필사진 등록</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPY-MYAF-10-50-S">
<input type="hidden" id="ENTER_FLAG" name="ENTER_FLAG" value=""/>
<input type="hidden" name="AFLT_ID" id="AFLT_ID" value=""/>
<input type="hidden" name="CTGR_CATG_CD" id="CTGR_CATG_CD" value=""/>
<input type="hidden" name="CTGR_CATG_NM" id="CTGR_CATG_NM" value=""/>
<input type="hidden" name="CTGR_NM" id="CTGR_NM" value=""/>

<div class="wrap bg_f7">
	<div class="header floating-back-header floating-sticky">
		<h1>프로필 사진 등록</h1>
		<a data-element-id="BPY-MYAF-10-50-S-e05" href="#" class="btn-history-back" id="btn_back">뒤로가기</a>
	</div>
	<!-- // header -->

	<div class="container">
		<div class="content">
			<!-- 프로필 사진 등록 -->
			<div class="store_profile addBtn-pb56">
				<div class="tit_bx">
					<h2>
						<strong>프로필 사진을 등록해 주세요.</strong>
					</h2>
					<p>가맹점을 대표하는 사진을 설정해 보세요.</p>
				</div>
				<div class="photo_regist">
					<div class="inner">
						<!-- 가맹점 프로필 사진 -->
						<div class="photo">
							<a data-element-id="BPY-MYAF-10-50-S-e06" href="#none" title="사진등록" id="btn_photo">
								
									<img id="prf_img" alt="프로필사진" db_src="" src="../assets/_sample/card.svg">
								
							</a>
						</div>
						<!-- //가맹점 프로필 사진 -->
						<!-- 팁 -->
						<p class="btn_tip"><a data-element-id="BPY-MYAF-10-50-S-e07" href="#none" role="button" id="btn_tip">이런 사진이 좋아요</a></p>
						<!-- //팁 -->
					</div>
				</div>
			</div>
			<!--//프로필 사진 등록 -->

			<!-- 하단 고정버튼 -->
			<div class="btn_botFix_w">
				<div class="inner bg_grey">
					<a data-element-id="BPY-MYAF-10-50-S-e08" href="#" class="btn_default btn-style-h48 round_r8 on" id="btn_save"><span>저장</span></a><!-- 활성/비활성화 시 클래스 on 추가/제거 -->
				</div>
			</div>
			<!-- //하단 고정버튼 -->
		</div>
	</div><!-- // container -->
</div><!-- // wrap -->
<!-- layer_overlay -->
<div class="layer_overlay" id="div_tip" style="display:none;">
	<!-- layerpopup -->
	<div class="popup_w">
		<div class="popup_con">
			<!-- 이런소개 좋아요pop -->
			<div class="intro_example slide">
				<p class="btn_close"><a href="#none" id="btn_closePop">팝업 닫기</a></p>
				<!-- 소개글 샘플 -->
				<div class="content">
					<div class="swiper-container example">
						<div class="swiper-wrapper">
							<div class="swiper-slide"><img src="../assets/resource/images/profile/photo1_exp_slide_1.png" alt=""/></div>
							<div class="swiper-slide"><img src="../assets/resource/images/profile/photo1_exp_slide_2.png" alt=""/></div>
						</div>
						<!-- Add Pagination -->
						<div class="swiper-pagination"></div>
					</div>
				</div>
				<!-- //소개글 샘플 -->
			</div>
			<!-- //이런소개 좋아요pop -->
		</div>
	</div>
	<!-- //layerpopup -->
</div>
<!-- //layer_overlay -->

<!-- 사진 수정 레이어팝업 -->
<div class="layer_overlay" id="edit_dim" style="display:none;">
	<div class="layer_bPop">
		<div class="popup_con pd0">
			<!-- 사진 추가/수정 시 dim 팝업 -->
			<div class="st_profile_pop">
				<!-- 메뉴선택 -->
				<ul id="btn_menu">
					<li><a href="#none">기본 이미지로 변경</a></li>
					<li><a href="#none">사진 촬영</a></li>
					<li><a href="#none">앨범에서 가져오기</a></li>
				</ul>
				<!-- //메뉴선택 -->
			</div>
			<!-- //사진 추가/수정 시 dim 팝업 -->
		</div>
	</div>
</div>
<!-- //레이어팝업 -->
<script>
	$(function(){
		var swiper = new Swiper('.swiper-container',{
			slidesPerView: 1,
			spaceBetween: 0,
			centeredSlides: true,
			autoplay: false,
			loop : false,
			autoHeight: true,
			pagination: {
				el: ".swiper-pagination",
				clickable: true,
			},
			observer: true,
			observeParents:true,
		});
	})
</script>
</body>
</html>
