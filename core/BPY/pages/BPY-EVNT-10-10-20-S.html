<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>비플머니 적립내역 상세</title>
  <link rel="stylesheet" href="../assets/resource/css/beple_popup.css">
  <link rel="stylesheet" href="../assets/resource/css/beple.css">
  <link rel="stylesheet" href="../assets/resource/css/beple_reset.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
</head>
<body data-screen-id="BPY-EVNT-10-10-20-S">
<div class="wrap">
		<!-- 헤더 -->
		<header class="header position-sticky">
			<div class="header__title-wrap">
				<h1 class="page-name"><span>내역 상세</span></h1>
			</div>

			<nav class="header__navi">
				<a data-element-id="BPY-EVNT-10-10-20-S-e02" id="btn_close" href="#none" class="header__btn btn-close">
					<span class="blind">페이지 닫기</span>
				</a>
			</nav>
		</header>

		<!-- 메인 컨텐츠 - 전자영수증 -->
		<main class="container-wrap js-container-wrap">
			<!-- 컨테이너 - 비플 M400a 전자영수증 -->
			<section class="container data-receipt data-receipt--type1 js-container">
				<!-- 컨테이너 헤더 -->
				<header class="container__header justify-spacing-def">
					<div class="container__header--content">
						<!-- 매장명, 금액 -->
						<h3 class="container__headline">
							<div class="store">
								<strong class="ellipsis-line--3"></strong>
							</div>
							<div class="price">
								<strong><span>4,500</span>원</strong>
							</div>
						</h3>
					</div>
				</header>

				<!-- 영수증 내역 -->
				<article class="container__body justify-spacing-def">
					<div class="body__content">
						<div class="flex-column">
							<div class="table-wrap">
								<!-- 테이블 - 영수증 내역 1 -->
								<section class="table--body">
									<table class="table table--data" aria-label="영수증 세부 내역 1">
										<colgroup>
											<col style="width: 102px;">
											<col style="width: 210px;">
										</colgroup>
										<tbody>
										    
										    <!-- 적립 내용 -->
											<tr>
												<th>
													<p>적립 내용</p>
												</th>
												<td>
													<p></p>
												</td>
											</tr>
											<!-- 적립일시 -->
											<tr>
												<th>
													<p>적립일시</p>
												</th>
												<td>
													<p></p>
												</td>
											</tr>
											<!-- 유효기간 -->
											<tr>
												<th>
													<p>유효기간</p>
												</th>
												<td>
													<p class="fc-primary"></p>
												</td>
											</tr>
										    
											
										</tbody>
									</table>
								</section>
							</div>
						</div>
					</div>
				</article>
			</section>
		</main>
	</div>
	<!-- // wrap -->
</body>
</html>
