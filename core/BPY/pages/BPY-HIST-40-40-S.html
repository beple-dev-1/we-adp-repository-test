<body data-screen-id="BPY-HIST-40-40-S">
<div class="wrap">
	<div class="header floating-back-header floating-sticky">
		<h1>전자영수증</h1>
		<div class="right">
			<a data-element-id="BPY-HIST-40-40-S-e03" id="btn_close" href="#none" class="btn_outpage">페이지나가기</a>
		</div>
	</div>
	<!-- // header -->

	<!-- container -->
	<div class="container">
		<!-- content -->
		<div class="contents">
			<!-- 2022-10-19 -->
			<!-- 전자영수증 -->
			<div class="integ_receipt">
				<div class="top_bx">
					<p class="date">2026.09.02 14:22</p>
				</div>
				<div class="st_name">
					<h2></h2>
				</div>
				<div class="amount">
					<p><strong>4,500</strong>원</p>
				</div>
				<!-- 결제정보 -->
				<div class="payment_info">
					<div class="info_con">
						<dl>
							<dt>공급가액</dt>
							<dd>4,091 원</dd>
						</dl>
						<dl>
							<dt>부가세</dt>
							<dd>409 원</dd>
						</dl>
					</div>
					<div class="info_con">
						<dl>
							<dt>승인번호</dt>
							<dd>000123</dd>
						</dl>
						<dl>
							<dt>거래유형</dt>
							<dd>비플페이 결제</dd>
						</dl>
					</div>
				</div>
				<!-- // 결제정보 -->
				<!-- 영수증 공유하기 -->
				
					<p class="receipt_send">
						<a data-element-id="BPY-HIST-40-40-S-e04" id="btn_receipt" href="#none"><span>영수증 공유하기</span></a>
					</p>
				
				<!-- //영수증 공유하기 -->
			</div>
			<!-- //2022-10-19 -->
			<!-- //전자영수증 -->
		</div>
		<!-- //content -->
	</div>
	<!-- //container -->
</div>
<!-- // wrap -->

<!-- 레이어 -->
<div class="layer_bPop" id="send_email" style="display:none;">
	<div class="pop_box">
		<a id="layer_close" class="btn_close"><span class="blind">닫기</span></a><!-- 2021-06-29 -->
		<div class="pop_content tp_br">
			<div class="pop_b_cn" style="padding-bottom:38px;">
				<div class="p_lytit">
					상품권 구매 영수증 받기
				</div>
				<div class="p_ly_emipt">
					<div class="ipt_input"><input maxlength="100" id="email1" type="text" placeholder="이메일을 입력하세요" value=""></div>
					<div class="ipt_slt">
						<select id="select_email">
							<option value="1" selected>직접입력</option>
							<option value="gmail.com">G메일</option>
							<option value="naver.com">네이버</option>
							<option value="daum.net">다음</option>
							<option value="hotmail.com">MS</option>
							<option value="nate.com">네이트</option>
						</select>
					</div>
				</div>
				<div class="p_ly_chkbx">
					<label for="agree-chk"><input type="checkbox" id="agree-chk" class="chk-general" checked><span class="txt">이메일 정보 기억</span>
				</div>
			</div>
			<div id="send_btn" class="pop_b_btn">
				<a class="on">발송하기</a>
			</div>
		</div>
	</div>
</div>
