<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>메뉴판 등록</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">
  <link rel="stylesheet" href="../assets/resource/css/zero.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick-theme.css">
  <link rel="stylesheet" href="../assets/resource/slick/slick.css">
  <link rel="stylesheet" href="../assets/resource/css/event.css">
  <link rel="stylesheet" href="../assets/resource/css/swiper.min.css">
</head>
<body data-screen-id="BPY-MYAF-10-10-S">
<div class="wrap bg_f7">
    <div class="header floating-back-header floating-sticky">
        <h1>메뉴판 등록</h1>
        <a data-element-id="BPY-MYAF-10-10-S-e06" id="go_back" href="#" class="btn-history-back">뒤로가기</a>
    </div>
    <!-- // header -->

    <div class="container">
        <div class="content">
            <!-- 메뉴판 사진 등록 -->
            <div class="store_profile addBtn-pb56">
                <div class="tit_bx">
                    <h2>
                        <strong>메뉴판 이미지를 추가해 주세요.</strong>
                    </h2>
                    <p>한 장당 10MB 이하, 최대 5장 추가 가능</p>
                </div>

                <div class="list_add">
                    <!-- 메뉴판 사진 -->
                    <div class="menu_board">
                        <ul id="menu_list">
                            
                            
                            <li class="imgSum" id="">
                                <div class="img_w">
                                    <p class="img">
                                        <a data-element-id="BPY-MYAF-10-10-S-e07" href="#none">
                                            <img alt="메뉴판 사진" src="../assets/_sample/card.svg">
                                            <input type="hidden" name="IMG_PATH" value="">
                                        </a>
                                    </p>
                                    <p class="del_btn">
                                        <a data-element-id="BPY-MYAF-10-10-S-e08" href="#none">
                                            <img src="../assets/resource/images/profile/ico_photo_delBtn.png" alt="사진삭제">
                                        </a>
                                    </p>
                                </div>
                            </li>
                                 
                            

                            <!--  <li>
                                  <div class="img_w">
                                      <p class="img">
                                          <a href="#none"><img alt="메뉴판 사진" src="../assets/_sample/card.svg"></a>
                                      </p>
                                      <p class="del_btn"><a href="#none"><img
                                              src="../assets/resource/images/profile/ico_photo_delBtn.png" alt="사진삭제"></a></p>
                                  </div>
                              </li>-->
                        </ul>
                    </div>
                    <!-- //메뉴판 사진 -->
                    <!-- 사진 추가 버튼 -->
                    <div class="btn_add" id="add_img">
                        <a data-element-id="BPY-MYAF-10-10-S-e09" href="#none">
                            <span>+ 사진 추가</span>
                        </a>
                    </div>
                    <!-- //사진 추가 버튼 -->
                </div>
            </div>
            <!--//메뉴판 사진 등록 -->

            <!-- 하단 고정버튼 -->
            <div class="btn_botFix_w">
                <div class="inner bg_grey">
                    <a data-element-id="BPY-MYAF-10-10-S-e10" href="#" class="btn_default btn-style-h46 round_r8 on" id="btn_ok"><span>저장</span></a>
                </div>
            </div>
            <!-- //하단 고정버튼 -->
        </div>
    </div><!-- // container -->
</div><!-- // wrap -->

<!-- 레이어팝업 -->
<div class="layer_overlay" style="display: none" id="layer_PopUp">
    <div class="layer_bPop">
        <div class="popup_con pd0" id="layer_Slider">
            <!-- 사진 추가/수정 시 dim 팝업 -->
            <div class="st_profile_pop">
                <!-- 메뉴선택 -->
                <ul>
                    <li id="img_camera"><a href="#none">사진 촬영</a></li>
                    <li id="img_album"><a href="#none">앨범에서 가져오기</a></li>
                </ul>
                <!-- //메뉴선택 -->
            </div>
            <!-- //사진 추가/수정 시 dim 팝업 -->
        </div>
    </div>
</div>

<!-- 사진상세보기 레이어팝업 -->
<div class="layer_overlay" id = "layer_imgDetail" style="display: none">
    <div class="popup_w">
        <div class="profile_photo_view">
            <!-- 닫기버튼 -->
            <div class="btn_photo_close">
                <a href="#none"><span class="blind">닫기</span></a>
            </div>
            <!-- //닫기버튼 -->
            <!-- 이미지 영역 -->
            <div class="photo_w" id = "layer_imgExpand">
                <img alt="이미지" src="../assets/_sample/card.svg">
            </div>
            <!-- //이미지 영역 -->
            <!-- 메세지 영역 - 텍스트 불필요 시 div class="inner" 내부 태그 삭제 -->
            <div class="intro_msg">
            </div>
            <!-- //메세지 영역 -->
        </div>
    </div>
</div>
<!-- //사진상세보기 레이어팝업 -->
</body>
</html>
