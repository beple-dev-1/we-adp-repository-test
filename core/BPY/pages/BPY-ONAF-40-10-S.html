					</span>
                </div>

                <div class="btn">
                    <a data-element-id="BPY-ONAF-40-10-S-e07" id="receipt_btn" href="#none" role="button" aria-label="전자 영수증 보기">전자 영수증 보기</a>

            <!-- 컨텐츠 영역 -->
            <!-- 결제내역 공유 -->
            <div class="pshare_bx">
                <dl>
                    <dd>
                        <div class="link_share">

                            <a data-element-id="BPY-ONAF-40-10-S-e09" id="send_kakao_btn" class="link2" role="link" aria-label="카카오톡으로 공유하기" tabindex="0"><span class="ico"></span><span class="txt" id="link2_txt">카카오톡으로<br> 공유하기</span></a>
                        </div>
                    </dd>
                </dl>
            </div>
            <!-- //결제내역 공유 -->
        </div>
        <!-- //컨텐츠 영역 -->

        <!-- 하단 고정버튼 -->
        <div class="fixed-bottom-section">
            <a data-element-id="BPY-ONAF-40-10-S-e10" id="confirm_btn"  href="#" class="btn-submit btn-skyBlue on" role="button"><span>확인</span></a><!-- 활성화클래스 on -->
        </div>
        <!-- //하단 고정버튼 -->

    </div>
