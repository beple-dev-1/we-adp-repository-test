  <title>고객센터 popup</title>
  <link rel="stylesheet" href="../assets/resource/css/style.css">

<body data-screen-id="BPY-COMN-30-20-S">
<!-- 해피톡 도움말 Chat SDK -->
<script type="text/javascript">

    // Initialize happytalk instance to use SDK in add
    var ht = new Happytalk({
            siteId: '4000002048',
            siteName: '비플페이',
            categoryId: '141498',
            divisionId: '141499',
        });

    setTimeout(function() {
        // open happTalk
        ht.open();
    }, 1000);

    // event handler after happyTalk initialized
    /* ht.event.on('happytalk:ready', functino () {
        // open happTalk
        ht.open();
    }); */

    // close browser tab
    ht.event.on('happytalk:close', function () {
        window.close();
    });

</script>
</body>
</html>
