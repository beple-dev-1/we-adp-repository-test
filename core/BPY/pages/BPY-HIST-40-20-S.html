<div class="layer_bPop" id="send_email" style="display:none;" role="dialog" aria-modal="true">
	<div class="pop_box">
		<div class="pop_content tp_br">
			<div class="pop_b_cn" style="padding-bottom:38px;">
				<div class="p_lytit">
					<label >결제 영수증 받기</label>
				</div>
				<a title="닫기" id="layer_close" class="btn_close" role="button"><span class="blind">닫기</span></a><!-- 2021-06-29 -->
				<div class="p_ly_emipt">
					<div class="ipt_input"><input title="이메일 입력" role="textbox" maxlength="100" id="email1" type="text" placeholder="이메일을 입력하세요" value=""></div>
					<div class="ipt_slt">
						<select id="select_email" title="조회 필터">
							<option value="1" selected>직접입력</option>
							<option value="gmail.com">G메일</option>
							<option value="naver.com">네이버</option>
							<option value="daum.net">다음</option>
							<option value="hotmail.com">MS</option>
							<option value="nate.com">네이트</option>
						</select>
					</div>
				</div>

				<div class="p_ly_chkbx">
					<label for="agree-chk"><input type="checkbox" id="agree-chk" class="chk-general" checked><span class="txt">이메일 정보 기억</span></label>
				</div>
			</div>
			<div id="send_btn" class="pop_b_btn">
				<a class="on" role="button">발송하기</a>
			</div>
		</div>
	</div>
</div>
