    <script type="text/javascript">
        var path = window.location.pathname;
        var pageName = path.split("/").pop(); //현재 페이지명

        if(pageName.indexOf("zero_onaf2_approve.act") == -1){
            $("#selectedAcct").removeClass("ico");
        }

        $("body").click(function(e){
            //결제계좌선택 레이어 영역이 아닌 경우, hide
            if($("#layer_acct_onaf").is(":visible")){
                if( !$(e.target).parents().is($("#layer_acct_onaf")) && !$(e.target).parents().is($(".gift_accbx")) ){
                    $("#layer_acct_onaf").hide();
                }
            }
        });

        $(".gift_accbx").click(function(){
            //결제하기 페이지에서만 결제계좌 선택 가능하도록
            if(pageName.indexOf("zero_onaf2_approve.act") > -1){
                //결제계좌선택 레이어 show
                $("#layer_acct_onaf").show();
            }
        });

        $("#manage_acct").click(function(){
            location.href="main_account.act";
        });

        //개인 계좌선택한 경우
        function fn_selected(bank_nm, acct_no, acct_no_enc, bank_cd, seq){
            $("#selectedAcct").text(bank_nm+"("+acct_no.substring(acct_no.length-4)+")계좌에서 결제됩니다." );
            $("#inc_bank_nm").val(bank_nm);
            $("#inc_acct_no").val(acct_no);
            $("#inc_acct_no_enc").val(acct_no_enc);
            $("#inc_bank_cd").val(bank_cd);
            $("#inc_seq").val(seq);
            $("#layer_acct_onaf").hide();

            fn_init_qr_confirm();
        }

        //법인 계좌선택한 경우
        function fn_selectedCp(org_nm, inc_cls_dsp_nm, card_no, nftf_pay_rest){
            if(nftf_pay_rest == "Y"){
                return alert("기업제로페이 비대면결제가\n제한된 결제계좌 입니다.");
            }
            $("#selectedAcct").text(inc_cls_dsp_nm+"에서 결제됩니다." );
            $("#inc_org_nm").val(org_nm);
            $("#inc_cls_dsp_nm").val(inc_cls_dsp_nm);
            $("#inc_card_no").val(card_no);
            $("#layer_acct_onaf").hide();

            fn_init_qr_confirm();
        }

        //세션 QR_CONFIRM 값 초기화
        function fn_init_qr_confirm() {
            var jexAjax = jexjs.createAjaxUtil("acct_onaf_zeropay_r001");
            jexAjax.setting("async", false);
            jexAjax.execute(function (response) {
            });
        }
    </script>
